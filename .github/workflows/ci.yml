# Continuous integration (guide §2 / §14): unit + contract + authorization tests, frontend checks,
# dependency / code scanning with retained reports, and a full-stack PostgreSQL system test.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build & tests (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build, unit and contract tests
        run: ./gradlew build --no-daemon --console=plain
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          retention-days: 30
          path: |
            */build/test-results/test/*.xml
            */build/reports/tests/test/**
      - name: Upload service jars (used by the system test)
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          retention-days: 3
          path: "*/build/libs/*-1.0.0-SNAPSHOT.jar"

  frontend:
    name: Frontend lint, types & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/qii-hrms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/qii-hrms/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: npm audit (production dependencies, report retained)
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          npm audit --omit=dev --audit-level=high
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          retention-days: 30
          path: frontend/qii-hrms/npm-audit.json

  dependency-scan:
    name: Dependency & config vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (dependencies, Dockerfiles, IaC, secrets)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          skip-dirs: frontend/qii-hrms/node_modules,.tmp-sys
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-report
          retention-days: 30
          path: trivy-fs.sarif

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4.9.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
      - if: matrix.language == 'java-kotlin'
        run: chmod +x gradlew
      - if: matrix.language == 'java-kotlin'
        run: ./gradlew compileJava --no-daemon --console=plain
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}

  system-test:
    name: System test (full stack on PostgreSQL, RabbitMQ, Redis, MinIO)
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Throwaway secrets (random per run)
        run: node scripts/ci/generate-env.mjs && node scripts/gen-rabbitmq-definitions.mjs
      - name: Start the stack
        run: docker compose --profile apps up -d --build --wait --wait-timeout 600
      - name: Seed reference data
        run: bash scripts/seed-qii-dev.sh load
      - name: Security, authentication and RBAC acceptance (SEC01 / DOC01)
        run: node scripts/test-security-rbac.mjs
      - name: Load smoke (budget gate p95 < 800 ms, errors < 1 %)
        run: node scripts/load-test.mjs --profile smoke --json load-smoke.json
      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-logs
          for s in $(docker compose --profile apps ps --services); do docker compose logs --no-color "$s" > "ci-logs/$s.log" 2>&1 || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-test-evidence
          retention-days: 30
          path: |
            ci-logs/
            load-smoke.json
      - name: Tear down
        if: always()
        run: docker compose --profile apps down -v
