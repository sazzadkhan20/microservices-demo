/* Layout: app shell — fixed left rail of grouped nav, sticky top bar with "viewing as" + demo clock, content column max 1180px */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1619; --surface:#162026; --sunk:#1c2830; --fg:#e4ecef; --muted:#93a4ad; --line:#2a3943;
  --accent:#4fb3cf; --accent-ink:#06222b; --accent-soft:#16343e;
  --good:#5cc790; --good-soft:#163428; --warn:#e2b04f; --warn-soft:#3a2f17; --bad:#f08079; --bad-soft:#3f1f1d;
  --info:#9aa6ef; --info-soft:#232846; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1619; --surface:#162026; --sunk:#1c2830; --fg:#e4ecef; --muted:#93a4ad; --line:#2a3943;
  --accent:#4fb3cf; --accent-ink:#06222b; --accent-soft:#16343e;
  --good:#5cc790; --good-soft:#163428; --warn:#e2b04f; --warn-soft:#3a2f17; --bad:#f08079; --bad-soft:#3f1f1d;
  --info:#9aa6ef; --info-soft:#232846; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);margin:0}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
h1{font-size:22px;font-weight:600}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:16px 12px 24px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-family:var(--mono)}
.brand b{display:block;font-size:14px}
.brand span{font-size:11.5px;color:var(--muted)}
.nav-grp{margin-top:14px}
.nav-grp .label{padding:0 8px 6px;display:block}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--fg);text-decoration:none;cursor:pointer}
.nav a:hover{background:var(--sunk)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.count{font-family:var(--mono);font-size:11.5px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;min-width:20px;text-align:center}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 24px}
.top .grow{flex:1}
.top-field{display:flex;align-items:center;gap:6px;font-size:12.5px}
.top-field select,.top-field input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.demo-tag{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:10px}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-6px}
.menu-btn{display:none}
.content{padding:24px;max-width:1180px;width:100%;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.page-head p{margin-top:4px;color:var(--muted);max-width:70ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card > h2{margin-bottom:12px}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}

.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.1}
.stat .s{font-size:12.5px;color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}

.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}

.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:500;text-align:left}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk);padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}

td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:12.5px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=email],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px}

.matrix select{width:auto;padding:3px 4px;font-size:12.5px}

.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px solid var(--line)}

.check-in{display:flex;flex-wrap:wrap;gap:16px;align-items:center}

  .cal .tag{display:none}
  .cal .d .dots{display:flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function seedAttendance(){
  const days = D.range('2026-09-01','2026-10-12');
  const forcedAbsent = ['arpa|2026-09-09','arpa|2026-09-23','arpa|2026-10-06'];
  S.order.forEach(id => {
    const e = S.emps[id];
    if(e.status!=='Active' && !e.exitDate) return;
    const sc = schedFor(e);
    days.forEach(date => {
      if(date < e.start) return;
      if(e.exitDate && date > e.exitDate) return;
      if(forcedAbsent.includes(id+'|'+date)) return;
      if(sc.mode==='hourly'){
        const hh = hash(id+date);
        if(date === '2026-10-12' || hh % 7 >= 3) return;
        const inM = 480 + (hh % 5) * 30, len = 240 + (hh % 4) * 60;
        S.att[id+'|'+date] = { in:tfmt(inM), out:tfmt(inM+len), loc:'Client site — Darwin', ip:ip(e,hh), device:'Phone — web', note:'On shoot' };
        return;
      }
      if(!isWorkingDay(e,date)) return;
      const lv = leaveOn(id,date);
      if(lv && !lv.half) return;
      const s = schedFor(e);
      const h = hash(id+date);
      if(date === '2026-10-12'){
        const today = { fayaz:'09:52', nafis:'10:02', redwan:'10:21', sadman:'09:58', fatiha:'09:47', niloy:'10:11', asman:'08:50', fardin:'08:55', sameen:'08:40', risul:'09:20', shamsad:'08:58' };
        if(!today[id]) return;
        S.att[id+'|'+date] = { in:today[id], out:null, loc: e.loc==='BD' ? (h%3?'Dhaka office':'Remote — home') : (h%2?'Darwin office':'Client site — Darwin'), ip: ip(e,h), device: h%2?'Phone — web':'Laptop — web', note:'' };
        return;
      }
      if(h%100 < 4) return; // absent
      const inM = tmin(s.start) - 20 + (h % 46);
      let outM = tmin(s.end) + (h % 35);
      let out = tfmt(outM);
      if(h % 17 === 0) out = null;
      else if(h % 23 === 0) out = tfmt(inM + 170);
      const site = e.team==='t-shoot' && h%3===0 ? 'Client site — Darwin' : e.loc==='BD' ? (h%4===0?'Remote — home':'Dhaka office') : 'Darwin office';
      S.att[id+'|'+date] = { in:tfmt(inM), out, loc:site, ip:ip(e,h), device: h%2?'Phone — web':'Laptop — web', note: site.startsWith('Client') ? 'On shoot' : '' };
    });
  });
}
function seedWork(){
  const NOTES = ['Drafted captions','Client revisions','Edited reels','QA review','Design iterations','Shoot prep','Footage logging','Monthly reporting','Outreach emails','Team sync','Scheduling posts','Colour grading'];
  Object.keys(S.att).sort().forEach(k => {
    const r = S.att[k], [id, date] = k.split('|');
    if(!r.out) return;
    const h = hash('wl'+k);
    if(h % 20 === 0) return; // a few days left without a log
    let w = tmin(r.out) - tmin(r.in); if(w < 0) w += 1440;
    const total = Math.max(30, Math.round((w - (h % 4) * 15) / 15) * 15);
    const mine = S.tasks.filter(t => t.assignees.includes(id) && !(t.status==='Done' && date > t.due));
    if(!mine.length) return;
    const n = Math.min(1 + h % 3, mine.length);
    let left = total;
    for(let i = 0; i < n; i++){
      const m = i === n-1 ? left : Math.max(15, Math.round(total / n / 15) * 15);
      left -= m; if(m <= 0) continue;
      S.worklogs.push({ id:uid('wl'), emp:id, date, task:mine[(h + i) % mine.length].id, minutes:m, note:NOTES[(h + i) % NOTES.length], created:date });
    }
  });
}
function ip(e,h){ return e.loc==='BD' ? `103.${100+h%40}.${h%250}.${h%97}` : `101.${160+h%30}.${h%250}.${h%89}`; }

  { key:'monthly_report', name:'Monthly attendance report emailed', who:'Every employee', def:true },
  { key:'payroll', name:'Payslip ready', who:'The employee', def:true },
  { key:'celebration', name:'Work anniversary and birthday', who:'Team feed (optional)', def:false }
];

/* =========================================================
   Model helpers
   ========================================================= */
const E = id => S.emps[id];
const nameOf = id => id ? (E(id) ? E(id).name : id) : '—';
const today = () => S.now.date;
const nowMin = () => tmin(S.now.time);
const me = () => E(S.me);
const isActive = e => e && (e.status==='Active' || e.status==='On leave');
const activeIds = () => S.order.filter(id => isActive(E(id)));
const teamName = id => (S.teams.find(t=>t.id===id)||{}).name || '—';
const deptName = id => (S.depts.find(d=>d.id===id)||{}).name || '—';
const locName = id => (S.locations.find(l=>l.id===id)||{}).name || '—';
const catName = id => (S.cats.find(c=>c.id===id)||{}).name || '—';
const roleName = id => (S.roles.find(r=>r.id===id)||{}).name || id;
const holders = roleId => activeIds().filter(id => (S.userRoles[id]||[]).includes(roleId));

function mgr(id, date){
  const e = E(id); if(!e) return null; date = date || today();
  const l = e.lines.find(l => l.from <= date && (!l.to || l.to >= date));
  if(l) return l.mgr;
  // before first line, take the earliest
  const first = e.lines.slice().sort((a,b)=>a.from<b.from?-1:1)[0];
  return first && date < first.from ? first.mgr : null;
}
function reportsOf(id){ return S.order.filter(x => x!==id && mgr(x)===id && isActive(E(x))); }
function isInTeam(managerId, targetId){
  let cur = mgr(targetId), guard = 0;
  while(cur && guard++ < 50){ if(cur === managerId) return true; cur = mgr(cur); }
  return false;
}
function wouldCycle(empId, newMgr){
  if(newMgr === empId) return true;
  let cur = newMgr, guard = 0;
  while(cur && guard++ < 50){ if(cur === empId) return true; cur = mgr(cur); }
  return false;
}

/* Permissions */
function scope(feature, action, userId){
  userId = userId || S.me;
  let best = 0;
  (S.userRoles[userId]||[]).forEach(rid => {
    const r = S.roles.find(r=>r.id===rid); if(!r) return;
    const s = r.perms[feature+'.'+action]; if(s && RANK[s] > best) best = RANK[s];
  });
  return best; // 0 none, 1 own, 2 team, 3 all
}
function can(feature, action, target, userId){
  userId = userId || S.me;
  const s = scope(feature, action, userId);
  if(!s) return false;
  if(target === undefined || target === null) return true;
  if(s === 3) return true;
  if(target === userId) return true;
  if(s === 2) return isInTeam(userId, target);
  return false;
}
const isAdminish = (u) => (S.userRoles[u||S.me]||[]).some(r => r==='admin' || r==='superadmin');
function visibleIds(feature, action){ return S.order.filter(id => can(feature, action, id)); }

/* Schedules & calendars */
function schedFor(e){
  return S.scheds.find(s=>s.scope==='employee'&&s.ref===e.id) || S.scheds.find(s=>s.scope==='team'&&s.ref===e.team) || S.scheds.find(s=>s.scope==='location'&&s.ref===e.loc) || S.scheds[0];
}
function holidayOn(e, date){
  const loc = S.locations.find(l=>l.id===e.loc); if(!loc) return null;
  return S.holidays.find(h => h.cal===loc.cal && h.start <= date && h.end >= date) || null;
}
function isWorkingDay(e, date){
  const s = schedFor(e);
  if(s.mode==='hourly') return false;
  if(!s.days.includes(D.dow(date))) return false;
  const h = holidayOn(e, date);
  if(h && !h.optional) return false;
  return true;
}

/* Leave */
function appliesTo(cat, e){
  const a = cat.applies;
  if(a.people.includes(e.id)) return true;
  const hasFilter = a.locations.length || a.types.length || a.teams.length;
  if(!hasFilter && a.people.length) return false;
  if(a.locations.length && !a.locations.includes(e.loc)) return false;
  if(a.types.length && !a.types.includes(e.type)) return false;
  if(a.teams.length && !a.teams.includes(e.team)) return false;
  return true;
}
function catsFor(e){ if(schedFor(e).mode==='hourly') return []; return S.cats.filter(c => c.active && appliesTo(c,e) && c.to >= today() && c.from <= D.add(today(), 400)); }
function countDays(e, start, end, half){
  if(!start || !end || end < start) return 0;
  let n = 0; D.range(start,end).forEach(d => { if(isWorkingDay(e,d)) n++; });
  if(half && start===end && n===1) return 0.5;
  return n;
}
function quotaFor(cat, e){
  let q = cat.quota;
  if(cat.prorate && e.start > cat.from && e.start <= cat.to){
    const total = D.diff(cat.from, cat.to) + 1, left = D.diff(e.start, cat.to) + 1;
    q = Math.round(q * left / total * 2) / 2;
  }
  if(e.start > cat.to) q = 0;
  return q;
}
function balance(empId, catId){
  const e = E(empId), cat = S.cats.find(c=>c.id===catId);
  const quota = quotaFor(cat, e);
  const cr = S.carry[empId+'|'+catId];
  const carried = cr && (!cr.expiry || today() <= cr.expiry) ? cr.days : 0;
  const adjusted = S.adjust.filter(a=>a.emp===empId&&a.cat===catId).reduce((s,a)=>s+a.days,0);
  const opening = S.opening[empId+'|'+catId] || 0;
  let taken = opening, pending = 0;
  S.reqs.filter(r=>r.emp===empId&&r.cat===catId).forEach(r => {
    if(r.status==='approved' || r.status==='cancel_pending') taken += r.days;
    else if(r.status==='pending') pending += r.days;
  });
  const total = quota + carried + adjusted;
  return { quota, carried, adjusted, opening, taken, pending, remaining: total - taken - pending, total };
}
function leaveOn(empId, date){
  return S.reqs.find(r => r.emp===empId && (r.status==='approved'||r.status==='cancel_pending') && r.start<=date && r.end>=date) || null;
}
function pendingLeaveOn(empId, date){
  return S.reqs.find(r => r.emp===empId && r.status==='pending' && r.start<=date && r.end>=date) || null;
}
function resolveChain(steps, e){
  const out = [], notes = []; let prev = null;
  steps.forEach((st,i) => {
    let a = null;
    if(st.type==='manager') a = mgr(e.id);
    else if(st.type==='mom') a = mgr(e.id) ? mgr(mgr(e.id)) : null;
    else if(st.type==='person') a = st.ref;
    else if(st.type==='role') a = holders(st.ref).find(x => x!==e.id) || null;
    const label = stepLabel(st);
    if(!a){ notes.push(`Step ${i+1} (${label}) skipped: nobody holds it`); return; }
    if(a === e.id){ notes.push(`Step ${i+1} (${label}) skipped: it would be ${e.name} approving their own request`); return; }
    if(a === prev){ notes.push(`Step ${i+1} (${label}) skipped: same person as the previous step`); return; }
    if(!isActive(E(a))){ notes.push(`Step ${i+1} (${label}) skipped: ${nameOf(a)} is not active`); return; }
    out.push({ approver:a, label, decision:null, by:null, at:null, comment:'', onBehalf:false });
    prev = a;
  });
  return { chain: out, notes };
}
function stepLabel(st){
  if(st.type==='manager') return 'Direct manager';
  if(st.type==='mom') return 'Manager’s manager';
  if(st.type==='person') return nameOf(st.ref);
  if(st.type==='role') return 'Any ' + roleName(st.ref);
  return st.type;
}
function makeRequest(emp, catId, start, end, half, reason, attach, created){
  const e = E(emp), cat = S.cats.find(c=>c.id===catId);
  const days = countDays(e, start, end, half);
  const { chain, notes } = resolveChain(cat.chain, e);
  const r = { id:uid('lv'), emp, cat:catId, start, end, half, days, reason, attach, status: chain.length ? 'pending' : 'approved', chain, step:0, notes, created, stepSince:created, cancel:null, clash: teamClash(emp, start, end) };
  if(!chain.length) r.notes.push('No approver in the chain, so the request was approved automatically.');
  return r;
}
function teamClash(empId, start, end, excludeId){
  const e = E(empId); if(!e || !start || !end || end < start) return [];
  const team = S.teams.find(t=>t.id===e.team); if(!team) return [];
  const max = team.maxOnLeave ?? 1; if(!max) return [];
  const out = [];
  D.range(start, end).forEach(d => {
    if(!isWorkingDay(e,d)) return;
    const others = S.reqs.filter(r => r.id!==excludeId && r.emp!==empId && E(r.emp).team===e.team && ['pending','approved','cancel_pending'].includes(r.status) && r.start<=d && r.end>=d);
    if(others.length >= max) out.push({ date:d, names: others.map(r => nameOf(r.emp)+' ('+(r.status==='pending'?'pending':'approved')+')') });
  });
  return out;
}
function clashText(e, list){
  const t = S.teams.find(t=>t.id===e.team);
  return `${t.name} allows ${t.maxOnLeave} ${t.maxOnLeave===1?'person':'people'} on leave per day. Already off: ` + list.map(c => `${D.short(c.date)}, ${c.names.join(', ')}`).join('; ') + '.';
}
function alertClash(r){
  const e = E(r.emp), team = S.teams.find(t=>t.id===e.team) || {};
  const to = [...new Set([mgr(r.emp), team.lead, r.chain[0] && r.chain[0].approver].filter(x => x && x!==r.emp))];
  notify(to, 'team_clash', `Team leave limit: ${e.name} asked for ${catName(r.cat)} on ${r.clash.map(c=>D.short(c.date)).join(', ')} while ${r.clash[0].names.join(', ')} is already off`, 'approvals', {}, 'clash|'+r.id);
}
function flowOf(r){ return r.status==='cancel_pending' ? r.cancel : r; }
function currentApprover(r){ const f = flowOf(r); return f && f.chain[f.step] ? f.chain[f.step].approver : null; }
function activeDelegate(userId){
  const d = S.delegations.find(d => d.from===userId && d.start<=today() && d.end>=today());
  return d ? d.to : null;
}
function canDecideLeave(r, userId){
  userId = userId || S.me;
  if(!(r.status==='pending' || r.status==='cancel_pending')) return { ok:false };
  if(r.emp === userId) return { ok:false, why:'Nobody approves their own leave.' };
  const cur = currentApprover(r);
  if(cur === userId) return { ok:true, as:'approver' };
  if(activeDelegate(cur) === userId) return { ok:true, as:'delegate' };
  if(scope('leave_requests','approve',userId) === 3) return { ok:true, as:'behalf' };
  return { ok:false, why:`Waiting for ${nameOf(cur)}.` };
}
function workingDaysBetween(e, a, b){ if(b <= a) return 0; let n=0; D.range(D.add(a,1), b).forEach(d=>{ if(isWorkingDay(e,d)) n++; }); return n; }

/* Attendance */
function dayStatus(e, date){
  if(date < e.start) return { code:'', label:'Not yet started' };
  if(e.exitDate && date > e.exitDate) return { code:'', label:'Left' };
  const s0 = schedFor(e);
  if(s0.mode==='hourly'){
    const r = S.att[e.id+'|'+date], t = today();
    if(date > t) return { code:'', label:'' };
    if(!r || !r.in) return { code:'', label:'No shift' };
    if(!r.out){
      const missing = date < D.add(t,-1) || (date === D.add(t,-1) && nowMin() >= 360) || (date === t && nowMin() >= tmin(s0.cutoff));
      return missing ? { code:'M', label:'Missing check-out' } : { code:'P', label:'Checked in', live:true };
    }
    return { code:'P', label:'Worked (hourly)' };
  }
  const h = holidayOn(e, date);
  if(h && !h.optional) return { code:'HO', label:'Holiday', note:h.name };
  const s = schedFor(e);
  if(!s.days.includes(D.dow(date))) return { code:'WO', label:'Weekly off' };
  const lv = leaveOn(e.id, date);
  if(lv && !lv.half) return { code:'OL', label:'On leave', note:catName(lv.cat) };
  const r = S.att[e.id+'|'+date];
  const t = today();
  if(date > t) return { code:'', label:'' };
  if(!r || !r.in){
    if(lv) return { code:'OL', label:'On leave (half day)', note:catName(lv.cat) };
    if(date === t) return nowMin() < tmin(s.start) + s.grace ? { code:'', label:'Not checked in yet' } : { code:'NC', label:'Not checked in' };
    return { code:'A', label:'Absent' };
  }
  const late = !lv && tmin(r.in) > tmin(s.start) + s.grace;
  if(!r.out){
    const yesterday = D.add(t,-1);
    const missing = date < yesterday || (date === yesterday && nowMin() >= 360) || (date === t && nowMin() >= tmin(s.cutoff));
    if(missing) return { code:'M', label:'Missing check-out', late };
    return { code: late?'L':'P', label: late ? 'Late — checked in' : 'Checked in', late, live:true };
  }
  let worked = tmin(r.out) - tmin(r.in); if(worked < 0) worked += 1440;
  if(!lv && worked < s.half*60) return { code:'HD', label:'Half day', late, worked };
  return { code: late?'L':'P', label: late?'Late':'Present', late, worked };
}
/* Work hours */
function workedMin(e, date){
  const r = S.att[e.id+'|'+date]; if(!r || !r.in) return 0;
  if(r.out){ let w = tmin(r.out) - tmin(r.in); if(w < 0) w += 1440; return w; }
  if(date === today()){ const w = nowMin() - tmin(r.in); return w > 0 ? w : 0; }
  if(date === D.add(today(),-1) && nowMin() < 360) return 1440 - tmin(r.in) + nowMin();
  return 0;
}
function expectedMin(e, date){
  const s = schedFor(e);
  if(s.mode==='hourly') return 0;
  if(date < e.start || (e.exitDate && date > e.exitDate)) return 0;
  if(!isWorkingDay(e,date)) return 0;
  const full = tmin(s.end) - tmin(s.start);
  const lv = leaveOn(e.id, date);
  if(lv) return lv.half ? full/2 : 0;
  return full;
}
const loggedMin = (id, date) => S.worklogs.filter(w => w.emp===id && w.date===date).reduce((a,w) => a + w.minutes, 0);
const fmtH = m => { m = Math.round(m); const neg = m < 0; m = Math.abs(m); return (neg?'−':'') + Math.floor(m/60) + 'h ' + String(m%60).padStart(2,'0') + 'm'; };
const round2 = n => Math.round(n*100)/100;
const money = (n, c) => (c ? c+' ' : '') + Number(n||0).toLocaleString('en-US', { minimumFractionDigits:0, maximumFractionDigits:2 });
function monthRange(ym){ return [ym+'-01', ym+'-'+String(D.daysIn(ym)).padStart(2,'0')]; }
function patternText(e){
  const s = schedFor(e);
  if(s.mode==='hourly') return `Hourly${s.weeklyHours ? ', about '+s.weeklyHours+' h a week' : ''}`;
  return `${s.days.length} days a week (${s.days.map(d=>DOW[d]).join(' ')}), ${s.start}–${s.end}${s.scope==='employee' ? '' : ', '+(s.scope==='team'?'team':'location')+' default'}`;
}
function periodStats(e, from, to){
  const t = today(), s = schedFor(e);
  const st = { worked:0, expected:0, logged:0, leave:0, absent:0, late:0, half:0, missingOut:0, missingLog:0, present:0, workDays:0, daysCounted:0 };
  D.range(from, to).forEach(d => {
    if(d > t || d < e.start || (e.exitDate && d > e.exitDate)) return;
    st.daysCounted++;
    const ds = dayStatus(e, d), l = loggedMin(e.id, d);
    st.worked += workedMin(e, d); st.expected += expectedMin(e, d); st.logged += l;
    if(isWorkingDay(e,d)) st.workDays++;
    const lv = leaveOn(e.id, d); if(lv && isWorkingDay(e,d)) st.leave += lv.half ? 0.5 : 1;
    if(ds.code==='A') st.absent++;
    if(ds.code==='HD') st.half++;
    if(ds.late) st.late++;
    if(ds.code==='M') st.missingOut++;
    if(['P','L','HD','M'].includes(ds.code) && !ds.live) st.present++;
    const r = S.att[e.id+'|'+d];
    if(r && r.in && (r.out || d < t) && l === 0) st.missingLog++;
  });
  if(s.mode==='hourly') st.expected = Math.round((s.weeklyHours||0) * 60 * st.daysCounted / 7);
  return st;
}

/* Payroll */
function payCalc(id, ym){
  const e = E(id), p = e && e.pay; if(!p) return null;
  const [first, last] = monthRange(ym);
  const from = e.start > first ? e.start : first, to = e.exitDate && e.exitDate < last ? e.exitDate : last;
  if(from > to) return null;
  const t = today(), upto = to < t ? to : t;
  const adj = S.payAdj[ym+'|'+id] || { amount:0, note:'' };
  const row = { id, name:e.name, cur:e.currency, type:p.type, manual:Number(adj.amount)||0, manualNote:adj.note||'', flags:[] };
  if(p.type==='hourly'){
    let mins = 0, miss = 0;
    if(from <= upto) D.range(from, upto).forEach(d => { const r = S.att[id+'|'+d]; if(r && r.in && r.out) mins += workedMin(e,d); else if(r && r.in && d < t) miss++; });
    Object.assign(row, { hours:round2(mins/60), rate:p.rate, base:round2(mins/60*p.rate), absent:0, covered:0, unpaid:0, deductDays:0, deduction:0 });
    if(miss) row.flags.push(`${miss} shift${miss>1?'s':''} without check-out, not paid until corrected`);
  } else {
    const pr = S.settings.payroll;
    const monthWD = D.range(first, last).filter(d => isWorkingDay(e,d)).length;
    const empWD = D.range(from, to).filter(d => isWorkingDay(e,d)).length;
    const perDay = pr.divisor==='calendar' ? p.gross/30 : (monthWD ? p.gross/monthWD : 0);
    const base = pr.divisor==='calendar' ? p.gross * (D.diff(from,to)+1) / D.daysIn(ym) : perDay * empWD;
    let absent = 0, miss = 0;
    if(from <= upto) D.range(from, upto).forEach(d => { const st = dayStatus(e,d); if(st.code==='A') absent += 1; else if(st.code==='HD') absent += 0.5; else if(st.code==='M') miss++; });
    let unpaid = 0;
    S.reqs.filter(r => r.emp===id && (r.status==='approved' || r.status==='cancel_pending') && !(S.cats.find(c=>c.id===r.cat) || {paid:true}).paid)
      .forEach(r => D.range(r.start, r.end).forEach(d => { if(d >= from && d <= to && isWorkingDay(e,d)) unpaid += r.half ? 0.5 : 1; }));
    let covered = 0, avail = 0;
    if(pr.absenceRule==='balance'){
      avail = pr.absenceCats.reduce((a,c) => { const cat = S.cats.find(x=>x.id===c); if(!cat || !appliesTo(cat,e)) return a; return a + Math.max(0, balance(id,c).remaining); }, 0);
      covered = Math.min(absent, avail);
    }
    Object.assign(row, { gross:p.gross, monthWD, empWD, perDay:round2(perDay), base:round2(base), absent, covered, avail, unpaid, deductDays:absent - covered + unpaid });
    row.deduction = round2(row.deductDays * perDay);
    if(absent > covered && pr.absenceRule==='balance') row.flags.push(`${fmtDays(absent)} absent, only ${fmtDays(avail)} leave left: ${fmtDays(absent-covered)} deducted`);
    if(miss) row.flags.push(`${miss} missing check-out day${miss>1?'s':''}, counted as present`);
    if(from > first) row.flags.push(`Joined ${D.nice(from)}, prorated`);
    if(to < last) row.flags.push(`Left ${D.nice(to)}, prorated`);
    if(upto < to) row.flags.push(`Month not over: absences counted to ${D.nice(upto)}`);
  }
  row.net = round2(row.base - row.deduction + row.manual);
  return row;
}
const payRows = ym => S.order.map(id => payCalc(id, ym)).filter(Boolean);

/* Monthly report emails */
function sendMonthlyReports(ym, by){
  const [first, last] = monthRange(ym); let n = 0;
  S.order.forEach(id => {
    const e = E(id);
    if(e.start > last || (e.exitDate && e.exitDate < first)) return;
    if(!isActive(e) && !e.exitDate) return;
    const st = periodStats(e, first, last);
    const bals = catsFor(e).map(c => { const b = balance(id, c.id); return { name:c.name, rem:b.remaining, total:b.total }; });
    const leaves = S.reqs.filter(r => r.emp===id && r.status==='approved' && r.start<=last && r.end>=first).map(r => ({ cat:catName(r.cat), start:r.start, end:r.end, days:r.days }));
    const m = { id:uid('em'), to:e.email, emp:id, ym, subject:`Your attendance report: ${D.monthName(ym)}`, at:S.now.date+' '+S.now.time, by, stats:st, pattern:patternText(e), hourly:schedFor(e).mode==='hourly', bals, leaves, partial: last >= today() };
    S.outbox.unshift(m);
    notify(id, 'monthly_report', `Your ${D.monthName(ym)} attendance report was emailed to ${e.email}`, 'myemails', {}, 'mr|'+m.id);
    n++;
  });
  S.emailsSent[ym] = (S.emailsSent[ym]||0) + 1;
  log(by, 'Emailed monthly attendance reports', D.monthName(ym), '', `${n} employees`);
  return n;
}

const STATUS_LEGEND = [['P','Present'],['L','Late'],['HD','Half day'],['M','Missing check-out'],['A','Absent'],['NC','Not checked in (today)'],['OL','On leave'],['HO','Holiday'],['WO','Weekly off']];
const codeChip = (c,title) => c ? `<span class="code c-${c}" title="${esc(title||'')}">${c}</span>` : '<span class="muted small">·</span>';

/* Checklists */
function startChecklist(empId, kind, silent, baseDate){
  const e = E(empId);
  const base = baseDate || (kind==='onboarding' ? e.start : (e.exitDate || today()));
  const items = S.templates[kind].map(t => ({
    text:t.text, owner:t.owner,
    ownerId: t.owner==='employee' ? empId : t.owner==='manager' ? mgr(empId) : (holders('hr')[0] || 'fayaz'),
    due: D.add(base, t.dueOffset), done:false, doneBy:null, doneAt:null
  }));
  const c = { id:uid('cl'), emp:empId, kind, items, created: today() };
  S.checklists.push(c);
  if(!silent) log(S.me, `Started ${kind} checklist`, e.name);
  return c;
}
function openChecklist(empId, kind){ return S.checklists.find(c => c.emp===empId && c.kind===kind && c.items.some(i=>!i.done)) || null; }
function latestChecklist(empId, kind){ return S.checklists.filter(c => c.emp===empId && c.kind===kind).slice(-1)[0] || null; }

/* Notifications & audit */
function notify(to, type, text, route, params, key){
  if(!S.notifSettings[type]) return;
  if(!to) return;
  const list = Array.isArray(to) ? to : [to];
  list.forEach(t => {
    const k = key ? key+'|'+t : null;
    if(k && S.notifs.some(n => n.key===k)) return;
    S.notifs.unshift({ id:uid('n'), to:t, type, text, route:route||'home', params:params||{}, at:S.now.date+' '+S.now.time, read:false, key:k });
  });
}

}
function ipOf(id){ const e = E(id); return e ? ip(e, hash(id)) : '—'; }

/* Computed reminders, run after every change */
function tick(){
  const t = today(), n = nowMin();
  // approvals waiting 2 working days
  S.reqs.forEach(r => {
    if(!(r.status==='pending' || r.status==='cancel_pending')) return;
    const f = flowOf(r), cur = currentApprover(r), e = E(r.emp);
    const since = f.stepSince || r.created;
    if(workingDaysBetween(e, since, t) >= 2){
      notify(cur, 'approval_waiting', `${e.name}’s ${catName(r.cat)} request has waited ${workingDaysBetween(e,since,t)} working days for you`, 'approvals', {}, 'wait|'+r.id+'|'+f.step+'|'+(r.status));
      notify(holders('admin').filter(x=>x!==cur && x!==r.emp), 'approval_waiting', `${e.name}’s ${catName(r.cat)} request is waiting on ${nameOf(cur)} for 2+ working days`, 'approvals', {}, 'waitadm|'+r.id+'|'+f.step+'|'+r.status);
    }
  });
  activeIds().forEach(id => {
    const e = E(id), s = schedFor(e);
    // missing check-in
    if(e.start <= t && isWorkingDay(e,t) && !leaveOn(id,t) && !(S.att[id+'|'+t]||{}).in && n >= tmin(s.start)+60)
      notify(id, 'missing_checkin', `You have not checked in today (${D.short(t)}). Office start is ${s.start}.`, 'home', {}, 'mci|'+t);
    // missing check-out
    const y = D.add(t,-1), ry = S.att[id+'|'+y], rt = S.att[id+'|'+t];
    if(ry && ry.in && !ry.out && n >= 360) notify(id,'missing_checkout',`No check-out recorded for ${D.short(y)}. Request a correction.`, 'myatt', {}, 'mco|'+y);
    if(rt && rt.in && !rt.out && n >= tmin(s.cutoff)) notify(id,'missing_checkout',`No check-out recorded for ${D.short(t)}.`, 'myatt', {}, 'mco|'+t);
    // probation / contract end
    [['probation','Probation'],['contractEnd', e.type==='Intern'?'Internship':'Contract']].forEach(([f,label]) => {
      const d = e[f]; if(!d) return; const left = D.diff(t, d);
      if(left >= 0 && left <= 14) notify([mgr(id), ...holders('hr')].filter(Boolean), 'contract_end', `${label} for ${e.name} ends on ${D.nice(d)} (${left} days)`, 'employee', {id}, 'end|'+id+'|'+f+'|'+d);
    });
  });
  // document expiry
  S.docs.forEach(d => { if(!d.expires) return; const left = D.diff(t, d.expires); if(left>=0 && left<=30) notify(holders('hr'),'doc_expiry',`${d.type} for ${nameOf(d.emp)} expires on ${D.nice(d.expires)}`, 'employee', {id:d.emp, tab:'documents'}, 'doc|'+d.id); });
  // checklist items due
  S.checklists.forEach(c => c.items.forEach((it,i) => { if(it.done || !it.ownerId) return; const left = D.diff(t, it.due); if(left <= 2) notify(it.ownerId,'checklist_due',`${c.kind==='onboarding'?'Onboarding':'Offboarding'} for ${nameOf(c.emp)}: "${it.text}" ${left<0?'is overdue':'is due '+D.nice(it.due)}`, 'checklists', {}, 'cl|'+c.id+'|'+i); }));
  // work log missing for recent worked days
  activeIds().forEach(id => {
    D.range(D.add(t,-3), D.add(t,-1)).forEach(d => {
      const r = S.att[id+'|'+d];
      if(r && r.in && loggedMin(id,d)===0){
        notify(id,'worklog_missing',`No work log for ${D.short(d)}. Add it under My work log.`,'myworklog',{date:d},'wlm|'+id+'|'+d);
        const m = mgr(id); if(m) notify(m,'worklog_missing',`${nameOf(id)} has no work log for ${D.short(d)}`,'worklogs',{wperson:id},'wlmm|'+id+'|'+d);
      }
    });
  });
  // monthly attendance report email on the 1st, for the previous month
  const prevYm = D.month(D.add(D.month(t)+'-01',-1));
  if(S.settings.monthlyEmail.on && !S.emailsSent[prevYm]) sendMonthlyReports(prevYm, 'System');
  // celebrations
  activeIds().forEach(id => { const e = E(id); if(e.start.slice(5)===t.slice(5) && e.start < t) notify(activeIds().filter(x=>E(x).team===e.team && x!==id),'celebration',`${e.name} celebrates ${Number(t.slice(0,4))-Number(e.start.slice(0,4))} years at Qii today`,'directory',{},'anniv|'+id+'|'+t); });
}

function chainHtml(r){
  const f = flowOf(r);
  if(!f) return '';
  const parts = f.chain.map((c,i) => {
    let cls = '', txt = esc(nameOf(c.approver));
    if(c.decision==='approved'){ cls='ok'; txt += ' ✓'; }
    else if(c.decision==='rejected'){ cls='no'; txt += ' ✕'; }
    else if(i===f.step && (r.status==='pending'||r.status==='cancel_pending')) cls='cur';
    if(c.onBehalf) txt += ` <span class="muted">(by ${esc(nameOf(c.by))})</span>`;
    return `<span class="st ${cls}">${txt}</span>`;
  });
  return `<div class="chain">${r.status==='cancel_pending'?'<span class="muted">Cancellation:</span>':''}${parts.join('<span class="muted">→</span>') || '<span class="muted">Auto-approved</span>'}</div>`;
}

}

function attendanceCalendar(empId, mine){
  const e = E(empId), ym = S.params.month || D.month(today());
  const first = ym+'-01', n = D.daysIn(ym), pad = D.dow(first);
  const days = D.range(first, ym+'-'+String(n).padStart(2,'0'));
  const counts = {};
  const cells = days.map(d => {
    const st = dayStatus(e,d); if(st.code) counts[st.code]=(counts[st.code]||0)+1;
    const r = S.att[empId+'|'+d];
    const cls = (st.code==='WO'||st.code==='HO') ? 'off' : '';
    return `<div class="d ${cls}${d===today()?' today':''}"><span class="row between"><span class="dn">${Number(d.slice(8))}</span>${codeChip(st.code, st.label)}</span>${r&&r.in?`<span class="num small">${r.in}–${r.out||'…'}</span>`:''}${st.note?`<span class="tag muted">${esc(st.note)}</span>`:''}</div>`;
  });
  const rows = days.filter(d => d <= today()).reverse().map(d => {
    const st = dayStatus(e,d), r = S.att[empId+'|'+d];
    if(!st.code) return '';
    const cor = S.corrections.find(c=>c.emp===empId && c.date===d && c.status==='pending');
    const canReq = mine && st.code!=='WO' && st.code!=='HO' && st.code!=='OL';

function leavePreviewText(e, f){
  f = f || S.leaveDraft || { cat:(catsFor(e)[0]||{}).id, start:D.add(today(),1), end:D.add(today(),1), half:'' };
  const cat = S.cats.find(c=>c.id===f.cat); if(!cat) return '';
  const v = validateLeave(e, f, true);
  const b = balance(e.id, cat.id);
  const steps = resolveChain(cat.chain, e);
  return `<b>${fmtDays(v.days)} working day${v.days===1?'':'s'}</b> · balance after request: <b class="num">${fmtDays(b.remaining - v.days)}</b> of ${fmtDays(b.total)} · approval: ${steps.chain.length ? steps.chain.map(c=>esc(nameOf(c.approver))).join(' → ') : 'automatic'}
    ${steps.notes.length?`<br><span class="small">${steps.notes.map(esc).join('<br>')}</span>`:''}
    ${v.errors.length?`<br><span style="color:var(--bad)">${v.errors.map(esc).join('<br>')}</span>`:''}
    ${(v.warnings||[]).length?`<br><span style="color:var(--warn);font-weight:600">${v.warnings.map(esc).join('<br>')}</span>`:''}`;
}
function validateLeave(e, f, preview){
  const errors = [];
  const cat = S.cats.find(c=>c.id===f.cat);
  if(!cat) return { errors:['Choose a category.'], days:0 };
  if(!f.start || !f.end) return { errors:['Choose both dates.'], days:0 };
  if(f.end < f.start) errors.push('The end date is before the start date.');
  if(f.half && f.start !== f.end) errors.push('Half day applies to a single date only. Set From and To to the same day.');
  if(f.half && !cat.half) errors.push(`${cat.name} does not allow half days.`);
  if(f.start < cat.from || f.end > cat.to) errors.push(`${cat.name} is valid from ${D.nice(cat.from)} to ${D.nice(cat.to)}.`);
  const days = errors.length ? 0 : countDays(e, f.start, f.end, f.half);
  if(!errors.length && days === 0) errors.push('No working days in this range (weekly days off and holidays are excluded).');
  const notice = D.diff(today(), f.start);
  if(cat.notice && notice < cat.notice) errors.push(`${cat.name} needs ${cat.notice} day${cat.notice>1?'s':''} notice. The earliest start is ${D.nice(D.add(today(),cat.notice))}.`);
  if(cat.maxPer && days > cat.maxPer) errors.push(`${cat.name} allows at most ${cat.maxPer} days per request.`);
  const b = balance(e.id, cat.id);
  if(days > 0 && b.remaining - days < -cat.negative) errors.push(`Not enough balance: ${fmtDays(b.remaining)} day${b.remaining===1?'':'s'} remaining${cat.negative?`, plus up to ${cat.negative} negative`:''}.`);
  const clash = S.reqs.find(r => r.emp===e.id && ['pending','approved','cancel_pending'].includes(r.status) && r.start<=f.end && r.end>=f.start && !(r.start===r.end && f.start===f.end && r.half && f.half && r.half!==f.half));
  if(clash) errors.push(`Overlaps your ${catName(clash.cat)} request for ${D.short(clash.start)}${clash.end!==clash.start?' – '+D.short(clash.end):''} (${clash.status.replace('_',' ')}).`);
  const warnings = [];
  if(!errors.length){
    const tc = teamClash(e.id, f.start, f.end);
    if(tc.length){
      const team = S.teams.find(t=>t.id===e.team);
      if(team.clashMode==='block') errors.push(clashText(e, tc) + ' Your team does not allow this.');
      else warnings.push(clashText(e, tc) + ' You can still apply; your manager will be alerted.');
    }
  }
  if(!preview){
    const needs = cat.attach.mode==='always' || (cat.attach.mode==='after' && days > cat.attach.n);
    if(needs && !f.attach) errors.push(`${cat.name} needs an attachment ${cat.attach.mode==='after'?`for more than ${cat.attach.n} days`:''}.`);
    if(!f.reason || !f.reason.trim()) errors.push('Add a reason.');
  }
  return { errors, warnings, days };
}

}

function orgChart(filterDept){
  const roots = activeIds().filter(id => !mgr(id) || !isActive(E(mgr(id))));
  const node = (id, depth) => {
    if(depth > 12) return '';
    const kids = reportsOf(id);
    const e = E(id);
    return `<li><span class="node"><b>${esc(e.name)}</b><span class="small muted">${esc(e.title)} · ${esc(e.loc)}</span></span>${kids.length?`<ul>${kids.map(k=>node(k,depth+1)).join('')}</ul>`:''}</li>`;
  };
  return `<section class="card tree" style="overflow-x:auto"><ul>${roots.map(r=>node(r,0)).join('')}</ul></section>`;
}

function employeeDetail(id, isSelf){
  const e = E(id); if(!e) return pageDenied();
  const tab = S.params.tab || 'profile';
  const canEmp = can('profile_employment','edit',id) && id!==S.me || (can('profile_employment','edit',id) && isAdminish());
  const canRoles = scope('roles','edit')>0;
  const tabs = [['profile','Profile'],['employment','Employment']];
  if(can('documents','view',id)) tabs.push(['documents','Documents']);
  if(can('leave_balances','view',id) || isSelf) tabs.push(['leave','Leave']);
  if(can('attendance','view',id) || isSelf) tabs.push(['attendance','Attendance']);
  if(can('worklogs','view',id)) tabs.push(['worklog','Work log']);
  if(can('salary','view',id)) tabs.push(['salary','Salary']);
  if(can('checklists','view',id)) tabs.push(['checklist','Checklists']);
  if(can('profile_employment','view',id)) tabs.push(['history','History']);
  if(isSelf) tabs.push(['delegate','Away cover']);
  let body = '';
  if(tab==='profile') body = profileTab(e, isSelf);
  else if(tab==='employment') body = employmentTab(e);
  else if(tab==='documents') body = documentsTab(e);
  else if(tab==='leave') body = leaveTabFor(e);
  else if(tab==='attendance') body = attendanceCalendar(id, false);
  else if(tab==='checklist') body = checklistTab(e);
  else if(tab==='salary') body = salaryTab(e);
  else if(tab==='worklog') body = worklogTable([id], D.add(today(),-13), today(), false);
  else if(tab==='history') body = historyTab(e);
  else if(tab==='delegate') body = delegateTab(e);
  return `
  <div class="page-head"><div><div class="row"><h1>${esc(e.name)}</h1>${statusPill(e.status)}</div><p>${esc(e.title)} · ${esc(teamName(e.team))} · ${esc(locName(e.loc))} · <span class="mono">${e.code}</span></p></div>
    <div class="row">${canEmp?`<button class="btn" data-act="modal" data-m="employee" data-id="${id}">Edit employment</button><button class="btn" data-act="modal" data-m="status" data-id="${id}">Change status</button>`:''}${canRoles&&!isSelf?`<button class="btn" data-act="modal" data-m="userRoles" data-id="${id}">Roles</button>`:''}</div></div>
  <div class="tabs">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="tab" data-t="${k}">${l}</button>`).join('')}</div>
  ${body}`;
}

/* Dashboard */
PAGES.dashboard = () => {
  const ids = visibleIds('reports','view').filter(id=>isActive(E(id)));
  const t = today();
  const st = ids.map(id => ({ id, s:dayStatus(E(id),t) }));
  const inToday = st.filter(x => S.att[x.id+'|'+t] && S.att[x.id+'|'+t].in);
  const late = st.filter(x => x.s.late);
  const onLeave = ids.filter(id => leaveOn(id,t));
  const pend = S.reqs.filter(r => ids.includes(r.emp) && (r.status==='pending'||r.status==='cancel_pending'));
  const ending = [];
  ids.forEach(id => { const e=E(id); [['probation','Probation'],['contractEnd',e.type==='Intern'?'Internship':'Contract']].forEach(([f,l])=>{ if(e[f]){const left=D.diff(t,e[f]); if(left>=0&&left<=30) ending.push({e,l,d:e[f],left});} }); });
  const byLoc = {}, byType = {}; ids.forEach(id => { const e=E(id); byLoc[e.loc]=(byLoc[e.loc]||0)+1; byType[e.type]=(byType[e.type]||0)+1; });
  const expected = ids.filter(id => { const lv = leaveOn(id,t); return E(id).start<=t && isWorkingDay(E(id),t) && !(lv && !lv.half); }).length;
  return `${head('Admin dashboard', `${D.short(t)} at ${S.now.time}. Numbers cover the ${ids.length} people your role can see.`)}
  <div class="grid g3">
    <div class="card stat"><span class="label">Headcount</span><span class="v">${ids.length}</span><span class="s">${Object.entries(byLoc).map(([k,v])=>`${k} ${v}`).join(' · ')} — ${Object.entries(byType).map(([k,v])=>`${k} ${v}`).join(', ')}</span></div>
    <div class="card stat"><span class="label">Checked in today</span><span class="v">${inToday.length}<span class="muted" style="font-size:16px"> / ${expected}</span></span><span class="s">Expected = working today, not on leave</span></div>
    <div class="card stat"><span class="label">On leave today</span><span class="v">${onLeave.length}</span><span class="s">${onLeave.map(nameOf).join(', ')||'Nobody'}</span></div>
    <div class="card stat"><span class="label">Late today</span><span class="v">${late.length}</span><span class="s">${late.map(x=>nameOf(x.id)).join(', ')||'Nobody'}</span></div>
    <div class="card stat"><span class="label">Pending leave approvals</span><span class="v">${pend.length}</span><span class="s">${pend.filter(r=>workingDaysBetween(E(r.emp),flowOf(r).stepSince||r.created,t)>=2).length} waiting 2+ working days</span></div>
    <div class="card stat"><span class="label">Ending in 30 days</span><span class="v">${ending.length}</span><span class="s">Probation, contract and internship end dates</span></div>
  </div>
  ${hoursSection()}
  <div class="grid g2">
    <section class="card"><h2>Not checked in yet</h2>${st.filter(x=>x.s.code==='NC').map(x=>`<p>${esc(nameOf(x.id))} <span class="muted small">· ${esc(teamName(E(x.id).team))}</span></p>`).join('')||'<p class="muted">Everyone expected has checked in.</p>'}</section>
    <section class="card"><h2>Ending soon</h2>${ending.sort((a,b)=>a.left-b.left).map(x=>`<p><button class="linkbtn" data-act="emp" data-id="${x.e.id}">${esc(x.e.name)}</button> · ${x.l} ends ${D.nice(x.d)} ${pill(x.left+' days', x.left<=14?'warn':'')}</p>`).join('')||'<p class="muted">Nothing in the next 30 days.</p>'}</section>
  </div>`;
};

function hoursSection(){
  const p = S.params, period = p.period || 'month', anchor = p.anchor || today();
  let from, to, label;
  if(period==='day'){ from = to = anchor; label = D.short(anchor); }
  else if(period==='week'){ from = D.add(anchor, -D.dow(anchor)); to = D.add(from, 6); label = `${D.short(from)} – ${D.short(to)}`; }
  else { [from, to] = monthRange(D.month(anchor)); label = D.monthName(D.month(anchor)); }
  let ids = visibleIds('reports','view').filter(id => { const e = E(id); return e.start <= to && (!e.exitDate || e.exitDate >= from) && (isActive(e) || e.exitDate); });
  if(p.hloc) ids = ids.filter(id => E(id).loc===p.hloc);
  if(p.hteam) ids = ids.filter(id => E(id).team===p.hteam);
  let rows = ids.map(id => ({ e:E(id), s:periodStats(E(id), from, to) }));
  const sort = p.hsort || 'name';
  const key = { name:x=>x.e.name, worked:x=>-x.s.worked, gap:x=>x.s.worked - x.s.expected, absent:x=>-x.s.absent, leave:x=>-x.s.leave, missing:x=>-x.s.missingLog }[sort];
  rows.sort((a,b) => { const ka = key(a), kb = key(b); return ka < kb ? -1 : ka > kb ? 1 : 0; });
  const tot = rows.reduce((a,x) => { ['worked','expected','logged','leave','absent','late','missingLog','missingOut','present'].forEach(k => a[k] = (a[k]||0) + x.s[k]); return a; }, {});
  S._csvName = `Work hours ${label}`;
  S._csv = [['Employee','Team','Pattern','Expected h','Worked h','Logged h','Gap h','Days present','Leave days','Absent','Late','Missing logs','Missing check-out'],
    ...rows.map(x => [x.e.name, teamName(x.e.team), patternText(x.e), (x.s.expected/60).toFixed(2), (x.s.worked/60).toFixed(2), (x.s.logged/60).toFixed(2), ((x.s.worked-x.s.expected)/60).toFixed(2), x.s.present, x.s.leave, x.s.absent, x.s.late, x.s.missingLog, x.s.missingOut])];
  const bar = s => { if(!s.expected) return ''; const pct = Math.min(100, s.worked / s.expected * 100); const c = pct >= 95 ? 'var(--good)' : pct >= 80 ? 'var(--warn)' : 'var(--bad)'; return `<div style="height:6px;background:var(--sunk);border-radius:3px;margin-top:4px;min-width:80px"><div style="height:6px;width:${pct}%;background:${c};border-radius:3px"></div></div>`; };
  return `<section class="card stack">
    <div class="card-head" style="margin:0"><div><h2>Work hours, leave and attendance</h2><p class="small muted">Hours come from check-in and check-out. Logged hours come from work logs. Days after today are not counted.</p></div>
      <div class="row"><div class="tabs">${[['day','Daily'],['week','Weekly'],['month','Monthly']].map(([k,l])=>`<button class="${period===k?'on':''}" data-act="hPeriod" data-p="${k}">${l}</button>`).join('')}</div>
      <button class="btn sm" data-act="hShift" data-n="-1" aria-label="Previous">←</button><b>${esc(label)}</b><button class="btn sm" data-act="hShift" data-n="1" aria-label="Next">→</button></div></div>
    <div class="row">
      <select id="h-loc" data-change="hFilter" style="max-width:190px" aria-label="Location">${opts(S.locations.map(l=>[l.id,l.name]), p.hloc, 'All locations')}</select>
      <select id="h-team" data-change="hFilter" style="max-width:190px" aria-label="Team">${opts(S.teams.map(t=>[t.id,t.name]), p.hteam, 'All teams')}</select>
      <select id="h-sort" data-change="hFilter" style="max-width:220px" aria-label="Sort">${opts([['name','Sort by name'],['worked','Most hours worked'],['gap','Furthest below expected'],['absent','Most absences'],['leave','Most leave'],['missing','Most missing logs']], sort)}</select>
      ${scope('reports','export')>0?`<button class="btn sm" data-act="copyCsv">Copy CSV</button>`:''}

    <div class="grid g4">${[['Worked',fmtH(tot.worked||0),`of ${fmtH(tot.expected||0)} expected`],['Logged in work logs',fmtH(tot.logged||0),`${tot.worked?Math.round((tot.logged||0)/tot.worked*100):0}% of worked hours`],['Leave days',fmtDays(tot.leave||0),`${tot.absent||0} absent, ${tot.late||0} late`],['Missing',`${tot.missingLog||0} logs`,`${tot.missingOut||0} check-outs`]].map(([k,v,s])=>`<div class="stat" style="border:1px solid var(--line);border-radius:8px;padding:12px"><span class="label">${k}</span><span class="v" style="font-size:20px">${v}</span><span class="s">${s}</span></div>`).join('')}</div>

    ${rows.map(x => { const g = x.s.worked - x.s.expected; return `<tr><td><button class="linkbtn" data-act="empTab" data-id="${x.e.id}" data-t="attendance">${esc(x.e.name)}</button><br><span class="small muted">${esc(teamName(x.e.team))} · ${esc(patternText(x.e))}</span></td><td class="n">${x.s.expected?fmtH(x.s.expected):'—'}</td><td class="num" style="min-width:110px">${fmtH(x.s.worked)}${bar(x.s)}</td><td class="n">${fmtH(x.s.logged)}</td><td class="n" style="color:${x.s.expected?(g<-60?'var(--bad)':g>60?'var(--good)':'var(--muted)'):'var(--muted)'}">${x.s.expected?fmtH(g):'—'}</td><td class="n">${x.s.present}</td><td class="n">${x.s.leave?fmtDays(x.s.leave):'—'}</td><td class="n">${x.s.absent?`<b style="color:var(--bad)">${x.s.absent}</b>`:'—'}</td><td class="n">${x.s.late||'—'}</td><td class="n">${x.s.missingLog?`<b style="color:var(--bad)">${x.s.missingLog}</b>`:'—'}</td></tr>`; }).join('') || '<tr><td colspan="10" class="muted">Nobody matches these filters.</td></tr>'}
    </tbody></table></div>
  </section>`;
}

/* Work logs */
PAGES.myworklog = () => {
  const u = me(), date = S.params.date || today(), wl = S.settings.worklog;
  const minDate = D.add(today(), -wl.backDays), editable = date >= minDate && date <= today();
  const tasks = S.tasks.filter(t => t.assignees.includes(u.id) && t.status!=='Done');
  const logs = S.worklogs.filter(w => w.emp===u.id && w.date===date);
  const worked = workedMin(u, date), logged = loggedMin(u.id, date), r = S.att[u.id+'|'+date];
  const last = D.range(D.add(today(),-6), today()).reverse();
  return `${head('My work log', 'Log the time you spent on each task you are assigned. Your manager and admins can see it.')}
  <div class="note${wl.mode==='block'?' warn':''} small">${wl.mode==='block' ? `Mandatory: you cannot check out until today’s work log has at least one entry${wl.minPct?` and covers ${wl.minPct}% of the hours worked`:''}.` : 'Days you worked without a work log are flagged to your manager.'} You can log up to ${wl.backDays} days back.</div>
  <section class="card stack">
    <div class="card-head" style="margin:0"><div class="row"><button class="btn sm" data-act="wlDay" data-d="${D.add(date,-1)}" aria-label="Previous day">←</button><h2>${D.short(date)}</h2><button class="btn sm" data-act="wlDay" data-d="${D.add(date,1)}" ${date>=today()?'disabled':''} aria-label="Next day">→</button></div>
    <div class="row small" style="gap:6px 18px"><span>Punched <b class="num">${r&&r.in?r.in+'–'+(r.out||'…'):'—'}</b></span><span>Worked <b class="num">${fmtH(worked)}</b></span><span>Logged <b class="num">${fmtH(logged)}</b></span>${worked&&logged<worked-30?pill(`${fmtH(worked-logged)} not logged`,'warn'):''}${logged>worked+60&&r?pill('Logged more than punched','info'):''}</div></div>
    ${editable ? (tasks.length ? `<form class="form-grid" data-form="worklog" data-date="${date}">
      <label class="field" for="wl-task"><span>Task</span><select id="wl-task" name="task">${opts(tasks.map(t=>[t.id,`${t.title} · ${t.client}`]))}</select></label>
      <label class="field" for="wl-h"><span>Time spent (hours)</span><input id="wl-h" name="hours" type="number" min="0.25" max="16" step="0.25" value="1" required></label>
      <label class="field full" for="wl-note"><span>What you did</span><input id="wl-note" name="note" type="text" placeholder="e.g. Edited 3 reels, applied client revisions" required></label>
      <div class="err full" id="wl-err"></div>
      <div class="full"><button class="btn primary">Add entry</button></div>
    </form>` : '<p class="muted">You have no open tasks assigned. Ask your manager to assign one.</p>') : `<p class="muted small">This day is outside the ${wl.backDays}-day logging window.</p>`}
    <div class="tbl-wrap"><table><thead><tr><th>Task</th><th>Client</th><th class="n">Time</th><th>Note</th><th></th></tr></thead><tbody>${logs.map(w=>{const t=S.tasks.find(x=>x.id===w.task)||{};return `<tr><td>${esc(t.title||'—')}</td><td>${esc(t.client||'')}</td><td class="n">${fmtH(w.minutes)}</td><td>${esc(w.note)}</td><td>${editable?`<button class="btn sm danger" data-act="delWl" data-id="${w.id}">Delete</button>`:''}</td></tr>`}).join('') || '<tr><td colspan="5" class="muted">No entries for this day.</td></tr>'}</tbody></table></div>
  </section>
  <section class="card"><h2>Last 7 days</h2><div class="tbl-wrap"><table><thead><tr><th>Day</th><th>Punched</th><th class="n">Worked</th><th class="n">Logged</th><th>Status</th></tr></thead><tbody>${last.map(d=>{const rr=S.att[u.id+'|'+d],w=workedMin(u,d),l=loggedMin(u.id,d);const need=rr&&rr.in&&(rr.out||d<today());return `<tr class="click" data-act="wlDay" data-d="${d}"><td>${D.short(d)}</td><td class="num">${rr&&rr.in?rr.in+'–'+(rr.out||'…'):'—'}</td><td class="n">${w?fmtH(w):'—'}</td><td class="n">${l?fmtH(l):'—'}</td><td>${need&&!l?pill('Missing','bad'):l?pill('Logged','good'):rr&&rr.in?pill('In progress','info'):''}</td></tr>`}).join('')}</tbody></table></div></section>`;
};
function worklogTable(ids, from, to, onlyMissing){
  const rows = [];
  D.range(from, to).reverse().forEach(d => ids.forEach(id => {
    const e = E(id), r = S.att[id+'|'+d], logs = S.worklogs.filter(w => w.emp===id && w.date===d);
    if(!(r && r.in) && !logs.length) return;
    const l = logs.reduce((a,w)=>a+w.minutes,0), w = workedMin(e,d);
    const missing = r && r.in && (r.out || d < today()) && !l;
    if(onlyMissing && !missing) return;
    rows.push(`<tr><td>${D.short(d)}</td><td>${ids.length>1?`<button class="linkbtn" data-act="empTab" data-id="${id}" data-t="worklog">${esc(e.name)}</button>`:esc(e.name)}</td><td class="num">${r&&r.in?r.in+'–'+(r.out||'…'):'—'}</td><td class="n">${w?fmtH(w):'—'}</td><td class="n">${l?fmtH(l):'—'}</td><td>${missing?pill('No work log','bad'):logs.map(x=>{const t=S.tasks.find(t=>t.id===x.task)||{};return `<div class="small"><b>${esc(t.title||'—')}</b> · ${fmtH(x.minutes)} · <span class="muted">${esc(x.note)}</span></div>`}).join('')}${w&&l&&l<w-30?`<div>${pill(fmtH(w-l)+' not logged','warn')}</div>`:''}</td></tr>`);
  }));
  return `<div class="tbl-wrap"><table><thead><tr><th>Day</th><th>Employee</th><th>Punched</th><th class="n">Worked</th><th class="n">Logged</th><th>Entries</th></tr></thead><tbody>${rows.join('') || '<tr><td colspan="6" class="muted">No attendance or logs in this range.</td></tr>'}</tbody></table></div>`;
}

  if(p.wperson) ids = ids.filter(id => id===p.wperson);
  const canRule = scope('attendance_settings','edit')>0, wl = S.settings.worklog;
  return `${head('Team work logs', `Work logged against assigned tasks, next to the hours punched. ${scope('worklogs','view')===3?'Everyone':'Your direct and indirect reports'}.`)}
  <div class="row">
    <label class="top-field" for="wf-from">From <input id="wf-from" type="date" value="${from}" data-change="wlFilter"></label>
    <label class="top-field" for="wf-to">To <input id="wf-to" type="date" value="${to}" data-change="wlFilter"></label>
    <select id="wf-person" data-change="wlFilter" style="max-width:200px" aria-label="Person">${opts(visibleIds('worklogs','view').filter(id=>id!==S.me||scope('worklogs','view')===3).map(id=>[id,E(id).name]), p.wperson, 'Everyone')}</select>
    <label class="checks"><label><input type="checkbox" id="wf-miss" data-change="wlFilter"${p.wmiss?' checked':''}> Only days with no log</label></label>
  </div>
  ${worklogTable(ids, from, to, !!p.wmiss)}
  ${canRule?`<section class="card stack"><h2>Work log rule</h2>
    <form class="form-grid" data-form="wlRule">
      <label class="field" for="wr-mode"><span>When someone has no work log</span><select id="wr-mode" name="mode">${opts([['block','Block check-out until logged (mandatory)'],['flag','Allow check-out, flag to manager']], wl.mode)}</select></label>
      <label class="field" for="wr-pct"><span>Minimum share of worked hours to log (%)</span><input id="wr-pct" name="minPct" type="number" min="0" max="100" value="${wl.minPct}"><small>0 = at least one entry.</small></label>
      <label class="field" for="wr-back"><span>Days back an employee can log</span><input id="wr-back" name="backDays" type="number" min="0" max="31" value="${wl.backDays}"></label>
      <div class="full"><button class="btn sm primary">Save rule</button></div>

/* Tasks */
const taskVisible = t => t.by===S.me || t.assignees.some(a => can('tasks','view',a));

PAGES.tasks = () => {
  const st = S.params.st || 'open';
  const list = S.tasks.filter(taskVisible).filter(t => st==='all' || (st==='open' ? t.status!=='Done' : t.status==='Done'));

  <div class="tbl-wrap"><table><thead><tr><th>Task</th><th>Client</th><th>Assigned to</th><th>Due</th><th>Status</th><th class="n">Logged</th><th></th></tr></thead><tbody>${list.map(t=>{const mins=S.worklogs.filter(w=>w.task===t.id).reduce((a,w)=>a+w.minutes,0);const ed=taskEditable(t);return `<tr><td><b>${esc(t.title)}</b><br><span class="small muted">by ${esc(nameOf(t.by))}</span></td><td>${esc(t.client)}</td><td class="small">${t.assignees.length>6?`${t.assignees.length} people`:t.assignees.map(nameOf).map(esc).join(', ')}</td><td class="num">${t.due}${t.status!=='Done'&&t.due<today()?' '+pill('Overdue','bad'):''}</td><td>${ed?`<select id="ts-${t.id}" data-change="taskStatus" data-id="${t.id}" aria-label="Status">${opts(['Open','In progress','Done'],t.status)}</select>`:pill(t.status,t.status==='Done'?'good':'acc')}</td><td class="n">${fmtH(mins)}</td><td>${ed?`<button class="btn sm" data-act="modal" data-m="task" data-id="${t.id}">Edit</button>`:''}</td></tr>`}).join('') || '<tr><td colspan="7" class="muted">No tasks.</td></tr>'}</tbody></table></div>`;

/* Salary and payroll */
function salaryTab(e){
  const p = e.pay || { type:'monthly', gross:0, rate:0 };
  const canEdit = can('salary','edit',e.id) && e.id!==S.me;
  const hist = (S.payHistory[e.id]||[]).slice().reverse();
  const slips = Object.entries(S.payruns).filter(([,r]) => r.status==='final' && r.rows.some(x=>x.id===e.id)).sort((a,b)=>a[0]<b[0]?1:-1);
  const est = payCalc(e.id, D.month(today()));
  return `<section class="card stack"><div class="card-head" style="margin:0"><h2>Salary</h2>${canEdit?`<button class="btn sm primary" data-act="modal" data-m="salary" data-id="${e.id}">Change salary</button>`:''}</div>
    ${kv([['Pay type', p.type==='hourly'?'Hourly rate':'Monthly salary'], [p.type==='hourly'?'Hourly rate':'Monthly gross', `<b class="num">${money(p.type==='hourly'?p.rate:p.gross, e.currency)}</b>`], ['Effective from', D.nice(p.from)], ['Work pattern', esc(patternText(e))], ['Currency', esc(e.currency)], ['This month so far', est?`<span class="num">${money(est.net, e.currency)}</span> <span class="small muted">estimate</span>`:'']])}
  </section>
  <section class="card"><h2>Payslips</h2>${slips.length?`<div class="tbl-wrap"><table><thead><tr><th>Month</th><th class="n">Net pay</th><th></th></tr></thead><tbody>${slips.map(([ym,r])=>{const x=r.rows.find(x=>x.id===e.id);return `<tr><td>${D.monthName(ym)}</td><td class="n">${money(x.net,x.cur)}</td><td><button class="btn sm" data-act="modal" data-m="payslip" data-id="${e.id}" data-date="${ym}">View payslip</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="muted">No finalised payslips yet.</p>'}</section>
  ${can('salary','edit',e.id)?`<section class="card"><h2>Salary history</h2><div class="tbl-wrap"><table><thead><tr><th>Effective</th><th>Type</th><th class="n">Amount</th><th>Note</th><th>By</th></tr></thead><tbody>${hist.map(h=>`<tr><td class="num">${h.at}</td><td>${h.type}</td><td class="n">${money(h.amount,e.currency)}</td><td>${esc(h.note)}</td><td>${esc(nameOf(h.by))}</td></tr>`).join('')}</tbody></table></div></section>`:''}`;
}
PAGES.payroll = () => {
  const ym = S.params.ym || D.month(D.add(D.month(today())+'-01', -1));
  const run = S.payruns[ym], final = run && run.status==='final';
  const rows = final ? run.rows : payRows(ym);
  const [, last] = monthRange(ym), over = last < today();
  const canAdj = !final && scope('payroll','create')>0, canFinal = scope('payroll','approve')>0;
  const prevYm = D.month(D.add(ym+'-01',-1)), prevOpen = payRows(prevYm).length && !(S.payruns[prevYm] && S.payruns[prevYm].status==='final');
  const tot = {}; rows.forEach(r => { const t = tot[r.cur] = tot[r.cur] || { base:0, deduction:0, manual:0, net:0, n:0 }; t.base += r.base; t.deduction += r.deduction; t.manual += r.manual; t.net += r.net; t.n++; });
  S._csvName = `Payroll ${D.monthName(ym)}`;
  S._csv = [['Employee','Currency','Pay type','Monthly gross / hourly rate','Working days in month','Days employed','Hours worked','Absent days','Covered by leave','Unpaid leave days','Days deducted','Per-day rate','Base pay','Deduction','Adjustment','Adjustment note','Net pay','Notes'],
    ...rows.map(r => [r.name, r.cur, r.type, r.type==='hourly'?r.rate:r.gross, r.monthWD??'', r.empWD??'', r.hours??'', r.absent, r.covered, r.unpaid, r.deductDays, r.perDay??'', r.base, r.deduction, r.manual, r.manualNote, r.net, r.flags.join('; ')])];
  const pr = S.settings.payroll;
  return `${head('Payroll', 'Pay is calculated from each salary, the work pattern, attendance and leave. Check it, add adjustments, then finalise.', `<input type="month" id="pay-ym" value="${ym}" data-change="payMonth" style="max-width:170px" aria-label="Month">${scope('payroll','export')>0?'<button class="btn" data-act="copyCsv">Copy CSV</button>':''}`)}
  <div class="row between"><div class="row"><h2>${D.monthName(ym)}</h2>${final?pill(`Finalised by ${nameOf(run.by)} · ${run.at}`,'good'):pill('Draft: recalculates live','warn')}</div>
    <div class="row">${final && canFinal ? `<button class="btn" data-act="reopenPay" data-ym="${ym}">Reopen</button>` : ''}${!final && canFinal ? `<button class="btn primary" data-act="finalPay" data-ym="${ym}" ${over?'':'disabled'}>Finalise ${D.monthName(ym)}</button>` : ''}</div></div>
  ${!final && !over ? `<div class="note small">The month is not over. Finalising opens after ${D.nice(last)}; until then absences are counted up to today.</div>` : ''}
  ${!final && prevOpen ? `<div class="note warn small">${D.monthName(prevYm)} is not finalised. Finalise months in order, because absences covered by leave reduce the balance used for the next month.</div>` : ''}
  <div class="grid g3">${Object.entries(tot).map(([c,t])=>`<div class="card stat"><span class="label">Net pay · ${c} · ${t.n} people</span><span class="v" style="font-size:22px">${money(t.net,c)}</span><span class="s">Base ${money(t.base)} · deductions ${money(t.deduction)}${t.manual?` · adjustments ${money(t.manual)}`:''}</span></div>`).join('')}</div>
  <div class="tbl-wrap"><table><thead><tr><th>Employee</th><th>Basis</th><th class="n">Base pay</th><th class="n">Absent</th><th class="n">Covered by leave</th><th class="n">Unpaid leave</th><th class="n">Deduction</th><th class="n">Adjustment</th><th class="n">Net pay</th><th>Notes</th><th></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><button class="linkbtn" data-act="empTab" data-id="${r.id}" data-t="salary">${esc(r.name)}</button><br><span class="small muted">${r.cur}</span></td>
    <td class="small">${r.type==='hourly'?`${r.hours} h × ${money(r.rate)}`:`${money(r.gross)} a month<br>${r.empWD} of ${r.monthWD} working days · ${money(r.perDay)}/day`}</td>
    <td class="n">${money(r.base)}</td><td class="n">${r.type==='hourly'?'—':fmtDays(r.absent)}</td><td class="n">${r.covered?fmtDays(r.covered):'—'}</td><td class="n">${r.unpaid?fmtDays(r.unpaid):'—'}</td>
    <td class="n">${r.deduction?`<b style="color:var(--bad)">−${money(r.deduction)}</b><br><span class="small muted">${fmtDays(r.deductDays)} days</span>`:'—'}</td>
    <td class="n">${r.manual?`${r.manual>0?'+':''}${money(r.manual)}<br><span class="small muted">${esc(r.manualNote)}</span>`:'—'}</td>
    <td class="n"><b>${money(r.net)}</b></td><td class="small">${r.flags.map(esc).join('<br>')}</td>
    <td><div class="row"><button class="btn sm" data-act="modal" data-m="payslip" data-id="${r.id}" data-date="${ym}">Payslip</button>${canAdj?`<button class="btn sm" data-act="modal" data-m="payAdj" data-id="${r.id}" data-date="${ym}">Adjust</button>`:''}</div></td></tr>`).join('') || '<tr><td colspan="11" class="muted">Nobody was employed this month.</td></tr>'}
  </tbody></table></div>
  ${canFinal?`<section class="card stack"><h2>Payroll rules</h2>
    <form class="form-grid" data-form="payRules">
      <label class="field" for="pr-div"><span>Per-day rate for monthly salaries</span><select id="pr-div" name="divisor">${opts([['working','Salary ÷ working days in the month (from each person’s pattern)'],['calendar','Salary ÷ 30']], pr.divisor)}</select></label>
      <label class="field" for="pr-abs"><span>Absent days (no check-in, no approved leave)</span><select id="pr-abs" name="absenceRule">${opts([['balance','Take from leave balance first; deduct salary only beyond the balance'],['direct','Deduct salary for every absent day']], pr.absenceRule)}</select></label>
      <div class="field full"><span>Leave balances that can cover absences, in this order</span><div class="checks">${S.cats.filter(c=>c.active&&c.paid).map(c=>`<label><input type="checkbox" name="cats" value="${c.id}"${pr.absenceCats.includes(c.id)?' checked':''}> ${esc(c.name)}</label>`).join('')}</div></div>
      <p class="full small muted">A half day (worked under the half-day threshold) counts as 0.5 absent. Approved unpaid leave is always deducted. Hourly staff are paid hours worked × rate; shifts without a check-out are not paid until corrected.</p>
      <div class="full"><button class="btn sm primary">Save rules</button></div>
    </form></section>`:''}`;
};

/* Monthly report emails */

function buildReport(rep, ids, ym){
  const n = D.daysIn(ym), days = D.range(ym+'-01', ym+'-'+String(n).padStart(2,'0'));
  if(rep==='register'){
    const headers = ['Employee', ...days.map(d=>String(Number(d.slice(8)))), 'P','L','HD','M','A','OL'];
    const rows = ids.filter(id=>E(id).start<=days[n-1]).map(id => {
      const e = E(id), c = {};
      const cells = days.map(d => { const s = dayStatus(e,d); if(s.code) c[s.code]=(c[s.code]||0)+1; return { html: s.code?`<span class="code c-${s.code}" title="${esc(s.label)}">${s.code}</span>`:'', csv:s.code, cls:'' }; });
      return [ { text:e.name }, ...cells, ...['P','L','HD','M','A','OL'].map(k => ({ text:String(c[k]||0), cls:'n' })) ];
    });
    return { headers, rows, note:'Codes: '+STATUS_LEGEND.map(([c,l])=>`${c} ${l}`).join(' · ') };
  }
  if(rep==='late'){
    const headers = ['Employee','Team','Working days','Late','Absent','Missing check-out','Half day','Late %'];
    const rows = ids.map(id => { const e=E(id); let wd=0,l=0,a=0,m=0,h=0; days.forEach(d=>{ if(d>today()) return; const s=dayStatus(e,d); if(['P','L','HD','M','A','NC'].includes(s.code)) wd++; if(s.late) l++; if(s.code==='A') a++; if(s.code==='M') m++; if(s.code==='HD') h++; }); return [e.name, teamName(e.team), {text:String(wd),cls:'n'},{text:String(l),cls:'n'},{text:String(a),cls:'n'},{text:String(m),cls:'n'},{text:String(h),cls:'n'},{text:wd?Math.round(l/wd*100)+'%':'—',cls:'n'}]; });
    return { headers, rows, note:`${D.monthName(ym)}, up to the demo date. Late and absent are reported only; no automatic penalties.` };
  }
  if(rep==='balances'){
    const headers = ['Employee','Category','Quota','Carried','Adjusted','Taken','Pending','Remaining'];
    const rows = []; ids.forEach(id => catsFor(E(id)).forEach(c => { const b=balance(id,c.id); rows.push([E(id).name, c.name, ...[b.quota,b.carried,b.adjusted,b.taken,b.pending,b.remaining].map(v=>({text:fmtDays(v),cls:'n'}))]); }));
    return { headers, rows };
  }
  if(rep==='requests'){
    const headers = ['Employee','Category','From','To','Days','Status','Submitted','Approvers','Decision times'];
    const rows = S.reqs.filter(r=>ids.includes(r.emp)).sort((a,b)=>a.created<b.created?1:-1).map(r => [nameOf(r.emp), catName(r.cat), r.start, r.end, {text:fmtDays(r.days),cls:'n'}, {html:reqPill(r.status),csv:r.status}, r.created, r.chain.map(c=>nameOf(c.approver)+(c.decision?` (${c.decision})`:'')).join(' → ')||'auto', r.chain.filter(c=>c.at).map(c=>c.at).join(', ')]);
    return { headers, rows };
  }
  if(rep==='headcount'){
    const headers = ['Month','Headcount at month end','Joiners','Leavers'];
    const rows = []; let m = ym;
    for(let i=0;i<6;i++){
      const end = m+'-'+String(D.daysIn(m)).padStart(2,'0');
      const all = S.order.filter(id => (!S.params.loc||E(id).loc===S.params.loc) && (!S.params.team||E(id).team===S.params.team) && (!S.params.dept||E(id).dept===S.params.dept));
      const hc = all.filter(id => E(id).start<=end && (!E(id).exitDate || E(id).exitDate>end)).length;
      const j = all.filter(id => D.month(E(id).start)===m).map(nameOf);
      const l = all.filter(id => E(id).exitDate && D.month(E(id).exitDate)===m).map(nameOf);
      rows.push([D.monthName(m), {text:String(hc),cls:'n'}, j.join(', ')||'—', l.join(', ')||'—']);
      m = D.month(D.add(m+'-01',-1));
    }
    return { headers, rows, note:'Last six months, newest first.' };
  }
  const headers = ['ID','Name','Work email','Title','Department','Team','Manager','Type','Location','Currency','Start','Probation end','Contract end','Status'];
  const rows = ids.map(id => { const e=E(id); return [e.code,e.name,e.email,e.title,deptName(e.dept),teamName(e.team),nameOf(mgr(id)),e.type,e.loc,e.currency,e.start,e.probation||'',e.contractEnd||'',{html:statusPill(e.status),csv:e.status}]; });
  return { headers, rows };
}

PAGES.audit = () => {

};

function openModal(type, data){ S.modal = { type, data:data||{} }; renderModal(); }
function closeModal(){ S.modal = null; renderModal(); }
function renderModal(){
  const root = document.getElementById('modal-root');
  if(!S.modal){ root.innerHTML=''; return; }
  const m = MODALS[S.modal.type](S.modal.data);
  root.innerHTML = `<div class="overlay" data-act="overlay"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(m.title)}"><div class="modal-head"><h2>${esc(m.title)}</h2><button class="btn sm" data-act="closeModal">Close</button></div>${m.body}</div></div>`;
  const f = root.querySelector('input:not([type=hidden]),select,textarea'); if(f) setTimeout(()=>f.focus(),0);
}

/* =========================================================
   Actions
   ========================================================= */
function toast(msg, kind){
  const t = document.getElementById('toast-root');
  t.innerHTML = `<div class="toast ${kind||''}" role="status">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.innerHTML='', 3200);
}
function commit(msg, kind){ tick(); save(); render(); if(msg) toast(msg, kind); }
function go(route, params){ S.route = route; S.params = params || {}; S.navOpen = false; S.leaveDraft = null; save(); render(); window.scrollTo(0,0); }
function setErr(id, msg){ const el = document.getElementById(id); if(el) el.textContent = msg; }
function hist(empId, field, from, to){ (S.history[empId] = S.history[empId]||[]).push({ at:S.now.date+' '+S.now.time, by:S.me, field, from:String(from??''), to:String(to??'') }); }

const ACT = {
  go: d => go(d.r),
  nav: () => { S.navOpen = !S.navOpen; render(); },
  emp: d => go('employee', { id:d.id }),
  tab: d => { S.params.tab = d.t; save(); render(); },
  rep: d => { S.params.rep = d.t; save(); render(); },
  cal: d => { S.params.cal = d.c; render(); },
  roleTab: d => { S.params.role = d.id; render(); },
  month: d => { S.params.month = d.m; render(); },
  modal: d => openModal(d.m, { id:d.id, date:d.date, emp:d.emp }),
  closeModal: () => closeModal(),
  overlay: (d, el, ev) => { if(ev.target === el) closeModal(); },
  signout: () => { log(S.me,'Signed out',E(S.me).email); S.session = false; S.signinError=''; save(); render(); },
  signin: d => signin(d.email),
  openNotif: d => { const n = S.notifs.find(x=>x.id===d.id); if(!n) return; n.read = true; go(n.route, n.params); },
  readAll: () => { S.notifs.forEach(n => { if(n.to===S.me) n.read = true; }); commit(); },
  checkout: () => {
    const t = today(), y = D.add(t,-1);
    let key = S.me+'|'+t;
    const ry = S.att[S.me+'|'+y];
    if(ry && ry.in && !ry.out && nowMin() < 360 && !(S.att[key]||{}).in) key = S.me+'|'+y;
    const r = S.att[key]; if(!r) return;
    const wl = S.settings.worklog, day = key.split('|')[1];
    if(wl.mode==='block'){

const _confirm = {};
function confirmInline(key){ const now = Date.now(); if(_confirm[key] && now - _confirm[key] < 5000){ delete _confirm[key]; return true; } _confirm[key] = now; return false; }

function signin(email){
  email = (email||'').trim().toLowerCase();
  const fail = (why) => { S.signinError = why; log('System','Sign-in refused',email,'',why); save(); render(); };
  if(!email.endsWith('@qiicreative.com.au')) return fail('Only @qiicreative.com.au Google accounts can sign in.');
  const e = S.order.map(E).find(x => x.email.toLowerCase() === email);
  if(!e) return fail('This Google account has no employee record. Ask HR to add you first.');
  if(!isActive(e)) return fail(`This account is ${e.status.toLowerCase()} and cannot sign in.`);
  S.me = e.id; S.session = true; S.signinError = ''; S.route = 'home'; S.params = {};
  log(e.id,'Signed in',e.email);
  commit();
}

function decideLeave(id, decision, comment){
  const r = S.reqs.find(x=>x.id===id); if(!r) return;
  const ok = canDecideLeave(r); if(!ok.ok){ toast(ok.why||'You cannot decide this request','bad'); return; }
  const f = flowOf(r), step = f.chain[f.step];
  step.decision = decision; step.by = S.me; step.at = S.now.date+' '+S.now.time; step.comment = comment||''; step.onBehalf = S.me !== step.approver;
  const isCancel = r.status==='cancel_pending';
  const what = `${nameOf(r.emp)} · ${catName(r.cat)} ${r.start}${r.end!==r.start?' – '+r.end:''}${isCancel?' (cancellation)':''}`;
  log(S.me, `${decision==='approved'?'Approved':'Rejected'} leave step ${f.step+1}${step.onBehalf?` on behalf of ${nameOf(step.approver)}${ok.as==='delegate'?' (delegate)':''}`:''}`, what, '', comment||'');
  const managerToo = (who) => { const m = mgr(r.emp); return m && m!==who && m!==r.emp ? [r.emp, m] : [r.emp]; };
  if(decision==='rejected'){
    if(isCancel){ r.status = 'approved'; notify(r.emp,'leave_decided',`Cancellation of your ${catName(r.cat)} (${D.short(r.start)}) was rejected: ${comment}`,'myleave'); }
    else { r.status = 'rejected'; notify(managerToo(S.me),'leave_decided',`${r.emp===r.emp?nameOf(r.emp)+'’s':''} ${catName(r.cat)} for ${D.short(r.start)} was rejected by ${nameOf(S.me)}: ${comment}`,'myleave'); }
    closeModal(); commit('Request rejected'); return;
  }
  f.step++; f.stepSince = S.now.date;
  if(f.step >= f.chain.length){
    if(isCancel){ r.status = 'cancelled'; notify(managerToo(S.me),'leave_decided',`${nameOf(r.emp)}’s ${catName(r.cat)} for ${D.short(r.start)} is cancelled. ${fmtDays(r.days)} days returned.`,'myleave'); commit('Cancellation approved, days returned'); }
    else { r.status = 'approved'; r.step = r.chain.length; notify(managerToo(S.me),'leave_decided',`${nameOf(r.emp)}’s ${catName(r.cat)} for ${D.short(r.start)} was approved by ${nameOf(S.me)}`,'myleave'); commit('Leave approved'); }
  } else {
    notify(f.chain[f.step].approver,'leave_submitted',`${nameOf(r.emp)}’s ${catName(r.cat)}${isCancel?' cancellation':''} (${D.short(r.start)}, ${fmtDays(r.days)}d) is waiting for your approval`,'approvals');
    commit(`Approved. Now waiting for ${nameOf(f.chain[f.step].approver)}`);
  }
}
function decideCorrection(id, decision){
  const c = S.corrections.find(x=>x.id===id); if(!c) return;
  if(c.emp===S.me){ toast('Nobody corrects their own attendance','bad'); return; }
  c.status = decision; c.decidedBy = S.me; c.decidedAt = S.now.date;
  if(decision==='approved'){
    const k = c.emp+'|'+c.date, r = S.att[k] || { loc:'Correction', ip:'—', device:'—', note:'' };
    if(!r.corrected){ r.origIn = r.in||''; r.origOut = r.out||''; }
    r.in = c.in || r.in; r.out = c.out || r.out; r.corrected = true; S.att[k] = r;
  }
  log(S.me, `${decision==='approved'?'Approved':'Rejected'} attendance correction`, `${nameOf(c.emp)} · ${c.date}`, `${c.origIn||'—'}–${c.origOut||'—'}`, `${c.in||'—'}–${c.out||'—'}`);
  notify(c.emp,'correction',`Your attendance correction for ${D.short(c.date)} was ${decision} by ${nameOf(S.me)}`,'myatt');
  commit(`Correction ${decision}`);
}
