      closeModal(); go('employee', { id:nid }); toast(`${e.name} added`);
    }
  },
  personal: (f, form) => {
    const e = E(form.dataset.id);
    ['phone','personalEmail','address','dob','emName','emRel','emPhone'].forEach(k => { if(f.has(k)){ const val = f.get(k)||''; if(e[k]!==val){ log(S.me,'Edited personal details',`${e.name} · ${k}`, e[k], val); e[k] = val; } } });
    closeModal(); commit('Details saved');
  },
  status: (f, form) => {
    const id = form.dataset.id, e = E(id), st = f.get('status'), date = f.get('date'), reason = (f.get('reason')||'').trim();
    const leaving = st==='Resigned' || st==='Terminated';
    const reps = reportsOf(id), waiting = S.reqs.filter(r=>(r.status==='pending'||r.status==='cancel_pending') && currentApprover(r)===id);
    const errs = [];
    if(leaving && !reason) errs.push('Add a reason for leaving.');
    const cl = latestChecklist(id,'offboarding');
    if(leaving && !(cl && cl.items.every(i=>i.done))){
      if(!(f.get('override') && isAdminish())) errs.push('The offboarding checklist is not complete. Finish it first, or use the admin override with a reason.');
    }
    if(st!=='Active' && st!=='On leave' && (reps.length || waiting.length) && !f.get('newMgr')) errs.push(`Choose who takes over ${reps.length} direct report(s) and ${waiting.length} pending approval(s).`);
    if(id===S.me && st!=='Active' && st!=='On leave') errs.push('You cannot deactivate your own account.');
    if((S.userRoles[id]||[]).includes('superadmin') && holders('superadmin').length<=1 && st!=='Active' && st!=='On leave') errs.push('This is the only Super Admin. Give the role to someone else first.');
    if(errs.length){ setErr('st-err', errs.join(' ')); return; }
    const nm = f.get('newMgr');
    if(nm && st!=='Active' && st!=='On leave'){
      reps.forEach(rid => { const re = E(rid); const l = re.lines.find(l=>!l.to); if(l) l.to = D.add(date,-1)>=l.from ? D.add(date,-1) : l.from; re.lines.push({ mgr:nm, from:date, to:'' }); hist(rid,'Reporting manager',e.name,`${nameOf(nm)} from ${date}`); });
      waiting.forEach(r => { const fl = flowOf(r); fl.chain[fl.step].approver = nm; notify(nm,'leave_submitted',`${nameOf(r.emp)}’s ${catName(r.cat)} was reassigned to you`,'approvals'); });
      log(S.me,'Reassigned reports and approvals',e.name,'',`${reps.length} report(s), ${waiting.length} approval(s) to ${nameOf(nm)}`);
    }
    hist(id,'Status',e.status,st); log(S.me,'Changed status'+(leaving && f.get('override')?' (admin override)':''),e.name,e.status,`${st}${reason?' · '+reason:''}`);
    e.status = st;
    if(leaving || st==='Inactive'){ e.exitDate = date; e.exitReason = reason; if(leaving && !latestChecklist(id,'offboarding')) {} }
    if(st==='Active'){ e.exitDate=''; e.exitReason=''; }
    closeModal(); commit(`${e.name} is now ${st}${(leaving||st==='Inactive')?'. Sign-in is blocked.':''}`);
  },
  userRoles: (f, form) => {
    const id = form.dataset.id, roles = f.getAll('roles'), before = S.userRoles[id]||[];
    if(before.includes('superadmin') && !roles.includes('superadmin') && holders('superadmin').length<=1){ setErr('ur-err','Super Admin cannot be removed from its last holder.'); return; }
    S.userRoles[id] = roles;
    log(S.me,'Changed roles',nameOf(id),before.map(roleName).join(', ')||'none',roles.map(roleName).join(', ')||'none');
    closeModal(); commit('Roles saved');
  },
  doc: (f, form) => {
    const file = f.get('file'); if(!file || !file.name){ setErr('dc-err','Choose a file.'); return; }
    S.docs.push({ id:uid('doc'), emp:form.dataset.id, type:f.get('type'), name:file.name, uploaded:today(), by:S.me, expires:f.get('expires')||'' });
    log(S.me,'Uploaded document',`${nameOf(form.dataset.id)} · ${f.get('type')}`,'',file.name);
    closeModal(); commit('Document uploaded');
  },
  adjust: (f, form) => {
    const days = Number(f.get('days')); if(!days){ setErr('ad-err','Enter a non-zero number of days.'); return; }
    if(!(f.get('reason')||'').trim()){ setErr('ad-err','A reason is required.'); return; }
    const b = balance(form.dataset.id, f.get('cat'));
    S.adjust.push({ emp:form.dataset.id, cat:f.get('cat'), days, reason:f.get('reason'), by:S.me, at:S.now.date+' '+S.now.time });
    log(S.me,'Adjusted leave balance',`${nameOf(form.dataset.id)} · ${catName(f.get('cat'))}`, fmtDays(b.remaining), `${fmtDays(b.remaining+days)} (${days>0?'+':''}${days}: ${f.get('reason')})`);
    closeModal(); commit('Balance adjusted');
  },
  opening: f => {
    const k = f.get('emp')+'|'+f.get('cat'), before = S.opening[k]||0, v = Number(f.get('days'))||0;
    S.opening[k] = v; log(S.me,'Set opening balance',`${nameOf(f.get('emp'))} · ${catName(f.get('cat'))}`,`${before} taken`,`${v} taken`);
    commit('Opening balance saved');
  },
  cat: (f, form) => {
    const id = form.dataset.id, num = k => Number(f.get(k))||0;
    const errs = [];
    if(!(f.get('name')||'').trim()) errs.push('Name is required.');
    if(f.get('to') < f.get('from')) errs.push('The period ends before it starts.');
    if(f.get('carryMode')==='cap' && !num('carryCap')) errs.push('Set a carry cap, or choose None.');
    const chain = [];
    for(let i=0;i<4;i++){
      const t = f.get('stepType'+i), ref = f.get('stepRef'+i)||'';
      if(!t) continue;
      if(t==='person'){ if(!ref.startsWith('p:')){ errs.push(`Step ${i+1}: choose a person.`); continue; } chain.push({type:'person',ref:ref.slice(2)}); }
      else if(t==='role'){ if(!ref.startsWith('r:')){ errs.push(`Step ${i+1}: choose a role.`); continue; } chain.push({type:'role',ref:ref.slice(2)}); }
      else chain.push({type:t});
    }
    if(errs.length){ setErr('ct-err', errs.join(' ')); return; }
    const data = { name:f.get('name').trim(), quota:num('quota'), from:f.get('from'), to:f.get('to'),
      applies:{ locations:f.getAll('locs'), types:f.getAll('types'), teams:f.getAll('teams'), people:Array.from(form.querySelector('[name=people]').selectedOptions).map(o=>o.value) },
      paid:f.get('paid')==='1', half:f.get('half')==='1', attach:{ mode:f.get('attachMode'), n:num('attachN') }, notice:num('notice'), maxPer:num('maxPer'),
      prorate:f.get('prorate')==='1', carry:{ mode:f.get('carryMode'), cap:num('carryCap'), expiry:f.get('carryExpiry')||'' }, negative:num('negative'), chain };
    if(id){
      const c = S.cats.find(x=>x.id===id);
      if(c.quota !== data.quota) log(S.me,'Changed leave quota',c.name,`${c.quota} days`,`${data.quota} days — updates every assigned balance`);
      if(JSON.stringify(c.chain)!==JSON.stringify(data.chain)) log(S.me,'Changed approval chain',c.name,c.chain.map(stepLabel).join(' → '),data.chain.map(stepLabel).join(' → '));
      log(S.me,'Edited leave category',data.name);
      Object.assign(c, data);
      closeModal(); commit('Category saved. Pending requests keep the chain they were sent with.');
    } else {
      S.cats.push({ id:uid('c'), active:true, ...data });
      log(S.me,'Created leave category',data.name,'',`${data.quota} days, ${data.from} – ${data.to}`);
      closeModal(); commit(`${data.name} created`);
    }
  },
  sched: (f, form) => {
    const id = form.dataset.id, mode = f.get('mode') || 'fixed';
    let days = f.getAll('days').map(Number);
    if(mode==='hourly') days = [0,1,2,3,4,5,6];
    else {
      if(!days.length){ setErr('sc-err','Pick at least one working day.'); return; }
      if(f.get('end') <= f.get('start')){ setErr('sc-err','Office end must be after the start.'); return; }
    }
    const data = { mode, weeklyHours:Number(f.get('weeklyHours'))||0, days, start:f.get('start'), end:f.get('end'), grace:Number(f.get('grace'))||0, half:Number(f.get('half'))||0, cutoff:f.get('cutoff')||'23:59' };
    if(f.has('ref')){ const ref = f.get('ref'); data.scope = ref.startsWith('t:') ? 'team' : 'employee'; data.ref = ref.slice(2); }
    if(id){ const s = S.scheds.find(x=>x.id===id); const before = `${s.days.map(d=>DOW[d]).join(' ')} ${s.start}–${s.end}`; Object.assign(s, data); log(S.me,'Edited work schedule', s.scope==='location'?locName(s.ref):s.scope==='team'?teamName(s.ref):nameOf(s.ref), before, `${s.days.map(d=>DOW[d]).join(' ')} ${s.start}–${s.end}, grace ${s.grace}`); }
    else {
      if(S.scheds.some(s=>s.scope===data.scope && s.ref===data.ref)){ setErr('sc-err','An override already exists for this team or person. Edit it instead.'); return; }
      S.scheds.push({ id:uid('s'), ...data }); log(S.me,'Added schedule override', data.scope==='team'?teamName(data.ref):nameOf(data.ref),'',`${data.days.map(d=>DOW[d]).join(' ')} ${data.start}–${data.end}`);
    }
    closeModal(); commit('Schedule saved');
  },
  holiday: (f, form) => {
    if(f.get('end') < f.get('start')){ setErr('ho-err','The end date is before the start.'); return; }
    const data = { cal:f.get('cal'), name:f.get('name').trim(), start:f.get('start'), end:f.get('end'), type:f.get('type'), optional:f.get('optional')==='1' };
    if(form.dataset.id){ const h = S.holidays.find(x=>x.id===form.dataset.id); log(S.me,'Edited holiday',h.name,`${h.start}`,`${data.start}`); Object.assign(h,data); }
    else { S.holidays.push({ id:uid('h'), ...data }); log(S.me,'Added holiday',data.name,'',`${data.start}${data.end!==data.start?' – '+data.end:''}`); }
    S.params.cal = data.cal; S.params.year = data.start.slice(0,4);
    closeModal(); commit('Holiday saved');
  },
  role: f => {
    const name = f.get('name').trim(); if(S.roles.some(r=>r.name.toLowerCase()===name.toLowerCase())){ setErr('rl-err','A role with this name exists.'); return; }
    const src = S.roles.find(r=>r.id===f.get('copy'));
    const r = { id:uid('r'), name, desc:f.get('desc')||'', system:false, perms: src ? {...src.perms} : {} };
    S.roles.push(r); S.params.role = r.id; log(S.me,'Created role',name,'',src?`copied from ${src.name}`:'empty');
    closeModal(); commit(`${name} created`);
  },
  assignRole: (f, form) => {
    const id = f.get('emp'), role = form.dataset.role; if(!id) return;
    S.userRoles[id] = [...new Set([...(S.userRoles[id]||[]), role])];
    log(S.me,'Assigned role',nameOf(id),'',roleName(role)); commit(`${roleName(role)} given to ${nameOf(id)}`);
  },
  delegate: f => {
    if(f.get('end') < f.get('start')){ setErr('dg-err','The end date is before the start.'); return; }
    S.delegations.push({ id:uid('dg'), from:S.me, to:f.get('to'), start:f.get('start'), end:f.get('end') });
    log(S.me,'Set approval cover',nameOf(f.get('to')),'',`${f.get('start')} – ${f.get('end')}`);
    notify(f.get('to'),'leave_submitted',`${me().name} asked you to cover their approvals ${D.nice(f.get('start'))} – ${D.nice(f.get('end'))}`,'approvals');
    commit('Cover saved');
  },
  worklog: (f, form) => {
    const date = form.dataset.date, hrs = Number(f.get('hours')), note = (f.get('note')||'').trim();
    if(!(hrs > 0)){ setErr('wl-err','Enter the time spent.'); return; }
    if(!note){ setErr('wl-err','Describe what you did.'); return; }
    const mins = Math.round(hrs * 60);
    if(loggedMin(S.me, date) + mins > 16*60){ setErr('wl-err','A day cannot have more than 16 hours logged.'); return; }
    S.worklogs.push({ id:uid('wl'), emp:S.me, date, task:f.get('task'), minutes:mins, note, created:today() });
    commit(`Logged ${fmtH(mins)} for ${D.short(date)}`);
  },
  wlRule: f => {
    const before = JSON.stringify(S.settings.worklog);
    S.settings.worklog = { mode:f.get('mode'), minPct:Math.max(0,Math.min(100,Number(f.get('minPct'))||0)), backDays:Math.max(0,Number(f.get('backDays'))||0) };
    log(S.me,'Changed work log rule','Work logs',before,JSON.stringify(S.settings.worklog)); commit('Work log rule saved');
  },
  task: (f, form) => {
    const id = form.dataset.id, as = f.getAll('assignees');
    if(!as.length){ setErr('tk-err','Assign at least one person.'); return; }
    const data = { title:f.get('title').trim(), client:f.get('client').trim(), due:f.get('due'), status:f.get('status'), assignees:as };
    if(id){ Object.assign(S.tasks.find(t=>t.id===id), data); log(S.me,'Edited task',data.title); }
    else { S.tasks.push({ id:uid('tk'), by:S.me, created:today(), ...data }); log(S.me,'Assigned task',data.title,'',as.map(nameOf).join(', ')); }
    closeModal(); commit(id ? 'Task saved' : 'Task assigned');
  },
  salary: (f, form) => {
    const e = E(form.dataset.id), amt = Number(f.get('amount')), type = f.get('type');
    if(!(amt > 0)){ setErr('sl-err','Enter an amount above zero.'); return; }
    const p = e.pay || {}, before = p.type ? `${p.type} ${money(p.type==='hourly'?p.rate:p.gross, e.currency)}` : 'none';
    e.pay = { type, gross: type==='monthly'?amt:0, rate: type==='hourly'?amt:0, from:f.get('from') };
    (S.payHistory[e.id] = S.payHistory[e.id] || []).push({ at:f.get('from'), by:S.me, type, amount:amt, note:f.get('note') });
    log(S.me,'Changed salary',e.name,before,`${type} ${money(amt, e.currency)} from ${f.get('from')}`);
    closeModal(); commit('Salary saved');
  },
  payAdj: (f, form) => {
    const k = form.dataset.ym+'|'+form.dataset.id, amt = Number(f.get('amount'))||0;
    if(amt && !(f.get('note')||'').trim()){ setErr('pa-err','Add a note for the payslip.'); return; }
    S.payAdj[k] = { amount:amt, note:(f.get('note')||'').trim() };
    log(S.me,'Payroll adjustment',`${nameOf(form.dataset.id)} · ${D.monthName(form.dataset.ym)}`,'',`${amt} ${f.get('note')}`);
    closeModal(); commit('Adjustment saved');
  },
  payRules: f => {
    const before = JSON.stringify(S.settings.payroll);
    S.settings.payroll = { divisor:f.get('divisor'), absenceRule:f.get('absenceRule'), absenceCats:f.getAll('cats') };
    log(S.me,'Changed payroll rules','Payroll',before,JSON.stringify(S.settings.payroll)); commit('Payroll rules saved');
  },
  sendReports: f => { const ym = f.get('ym'); if(!ym) return; const n = sendMonthlyReports(ym, S.me); commit(`${D.monthName(ym)} report emailed to ${n} employees`); },
  addDept: f => { const n = f.get('name').trim(); S.depts.push({ id:uid('d'), name:n }); log(S.me,'Added department',n); commit('Department added'); },
  addTeam: f => { const n = f.get('name').trim(); S.teams.push({ id:uid('t'), name:n, dept:f.get('dept'), lead:f.get('lead')||'' }); log(S.me,'Added team',n,'',deptName(f.get('dept'))); commit('Team added'); },
  addTpl: (f, form) => { const k = form.dataset.k; S.templates[k].push({ text:f.get('text').trim(), owner:f.get('owner'), dueOffset:Number(f.get('due'))||0 }); log(S.me,'Added checklist template item',k,'',f.get('text')); commit('Item added to template'); }
};

const CHANGE = {
  switchUser: el => { S.me = el.value; S.params = {}; if(!routeAllowed(S.route)) S.route='home'; S.leaveDraft=null; commit(); },
  clock: () => {
    const d = document.getElementById('clock-date').value, t = document.getElementById('clock-time').value;
    if(!d || !t) return;
    S.now = { date:d, time:t }; commit(`Clock set to ${D.short(d)} ${t}`);
  },
  leavePreview: () => { const f = readLeaveForm(); S.leaveDraft = f; const el = document.getElementById('lv-preview'); if(el) el.innerHTML = leavePreviewText(me(), f); setErr('lv-err',''); },
  teamDate: el => { S.params.date = el.value; render(); },
  dirSearch: el => { S.params.q = el.value; render(); const n = document.getElementById('dir-q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } },
  empFilter: () => { const g = id => document.getElementById(id).value; S.params = { q:g('emp-q'), loc:g('emp-loc'), team:g('emp-team'), status:g('emp-status') }; render(); },
  repFilter: () => { const g = id => (document.getElementById(id)||{}).value; S.params = { rep:S.params.rep, month:g('rp-month')||S.params.month, loc:g('rp-loc'), dept:g('rp-dept'), team:g('rp-team'), person:g('rp-person') }; render(); },
  holYear: el => { S.params.year = el.value; render(); },
  auditQ: el => { S.params.q = el.value; render(); },
  perm: el => {
    const r = S.roles.find(x=>x.id===el.dataset.role); const k = el.dataset.k, before = r.perms[k]||'none';
    if(el.value) r.perms[k] = el.value; else delete r.perms[k];
    log(S.me,'Changed permission',`${r.name} · ${k}`,before,el.value||'none');
    commit(`${r.name}: ${k.replace('.',' › ')} set to ${el.value||'none'}`);
  },
  notifToggle: el => { S.notifSettings[el.dataset.k] = el.checked; log(S.me,'Changed notification setting',el.dataset.k,String(!el.checked),String(el.checked)); commit(); },
  tickCl: el => {
    const c = S.checklists.find(x=>x.id===el.dataset.id), it = c.items[Number(el.dataset.i)];
    it.done = true; it.doneBy = S.me; it.doneAt = today();
    log(S.me,'Completed checklist item',`${nameOf(c.emp)} · ${c.kind}`,'',it.text);
    commit(c.items.every(i=>i.done) ? `${c.kind==='onboarding'?'Onboarding':'Offboarding'} complete for ${nameOf(c.emp)}` : 'Item done');
  },
  hFilter: () => { const g = id => document.getElementById(id).value; S.params.hloc = g('h-loc'); S.params.hteam = g('h-team'); S.params.hsort = g('h-sort'); render(); },
  wlFilter: () => { const g = id => document.getElementById(id); S.params.from = g('wf-from').value; S.params.to = g('wf-to').value; S.params.wperson = g('wf-person').value; S.params.wmiss = g('wf-miss').checked ? '1' : ''; render(); },
  taskStatus: el => { const t = S.tasks.find(x=>x.id===el.dataset.id); const b = t.status; t.status = el.value; log(S.me,'Changed task status',t.title,b,el.value); commit('Task updated'); },
  payMonth: el => { if(el.value){ S.params.ym = el.value; render(); } },
  autoEmail: el => { S.settings.monthlyEmail.on = el.checked; log(S.me,'Changed monthly report email','Email',String(!el.checked),String(el.checked)); commit(el.checked?'Monthly emails switched on':'Monthly emails switched off'); },
  obMonth: el => { S.params.oym = el.value; render(); },
  teamRule: el => { const t = S.teams.find(x=>x.id===el.dataset.id), f = el.dataset.f, b = t[f]; t[f] = f==='maxOnLeave' ? Number(el.value) : el.value; log(S.me,'Changed team leave rule',`${t.name} · ${f}`,String(b),String(t[f])); commit(`${t.name} updated`); },
  tested: el => { S.tested[el.dataset.i] = el.checked; save(); }
};

/* Event delegation */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]'); if(!t) return;
  const fn = ACT[t.dataset.act]; if(!fn) return;
  if(t.dataset.act==='overlay' && ev.target!==t) return;
  ev.preventDefault();
  fn(t.dataset, t, ev);
});
document.addEventListener('change', ev => {
  const t = ev.target.closest('[data-change]'); if(!t) return;
  const fn = CHANGE[t.dataset.change]; if(fn) fn(t, ev);
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id==='dir-q' || t.id==='emp-q' || t.id==='au-q') return; // applied on change
});
document.addEventListener('submit', ev => {
  const form = ev.target.closest('[data-form]'); if(!form) return;
  ev.preventDefault();
  const fn = FORMS[form.dataset.form]; if(fn) fn(new FormData(form), form);
});
document.addEventListener('keydown', ev => { if(ev.key==='Escape' && S.modal) closeModal(); });

/* Boot */
if(!load()) { seed(); save(); }
render();
</script>

</body></html>
