server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # Allow Swagger UI Try-it-out even if browser host differs slightly
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: false
      # NOTE: Do NOT use default-filter RemoveRequestHeader=X-Tenant-ID here.
      # It runs AFTER JwtTenantGatewayFilter and would strip the trusted tenant
      # header we just injected. Stripping+injection is done only in that filter.
      routes:
        # --- OpenAPI docs proxied through gateway (for Swagger UI dropdown) ---
        - id: registry-docs
          uri: ${REGISTRY_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/docs/registry/**
          filters:
            - RewritePath=/docs/registry/(?<segment>.*), /${segment}

        - id: hrms-docs
          uri: ${HRMS_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/docs/hrms/**
          filters:
            - RewritePath=/docs/hrms/(?<segment>.*), /${segment}

        - id: payroll-docs
          uri: ${PAYROLL_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/docs/payroll/**
          filters:
            - RewritePath=/docs/payroll/(?<segment>.*), /${segment}

        - id: notification-docs
          uri: ${NOTIF_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/docs/notification/**
          filters:
            - RewritePath=/docs/notification/(?<segment>.*), /${segment}

        - id: file-docs
          uri: ${FILES_URI:http://127.0.0.1:8084}
          predicates:
            - Path=/docs/files/**
          filters:
            - RewritePath=/docs/files/(?<segment>.*), /${segment}

        - id: report-docs
          uri: ${REPORTS_URI:http://127.0.0.1:8085}
          predicates:
            - Path=/docs/reports/**
          filters:
            - RewritePath=/docs/reports/(?<segment>.*), /${segment}

        # --- Registry API (paths match Registry controllers: /api/registry/**) ---
        - id: registry-api
          uri: ${REGISTRY_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/api/registry/**
          filters: []

        # Convenience alias: /registry/provision → /api/registry/provision
        - id: registry-alias
          uri: ${REGISTRY_URI:http://127.0.0.1:8080}
          predicates:
            - Path=/registry/**
          filters:
            - RewritePath=/registry/(?<segment>.*), /api/registry/${segment}

        # --- Domain services (guide §3: People / Leave / Time&Work) ---
        # Path-split under /hrms/** keeps the Qii BFF unchanged while routing to separate services.
        - id: hrms-leave
          uri: ${LEAVE_URI:http://127.0.0.1:8086}
          predicates:
            - Path=/hrms/api/leave-applications/**,/hrms/api/leave-balances/**,/hrms/api/leave-types/**,/hrms/api/leave-categories/**,/hrms/api/leave-policy/**,/hrms/api/leave-delegates/**,/hrms/api/leave/**,/hrms/api/approvals/**
          filters:
            - RewritePath=/hrms/(?<segment>.*), /${segment}

        - id: hrms-time-work
          uri: ${TIME_WORK_URI:http://127.0.0.1:8087}
          predicates:
            - Path=/hrms/api/attendance/**,/hrms/api/work-schedules/**,/hrms/api/holidays/**,/hrms/api/tasks/**,/hrms/api/work-logs/**
          filters:
            - RewritePath=/hrms/(?<segment>.*), /${segment}

        - id: people
          uri: ${PEOPLE_URI:${HRMS_URI:http://127.0.0.1:8081}}
          predicates:
            - Path=/people/**
          filters:
            - RewritePath=/people/(?<segment>.*), /${segment}

        - id: leave
          uri: ${LEAVE_URI:http://127.0.0.1:8086}
          predicates:
            - Path=/leave/**
          filters:
            - RewritePath=/leave/(?<segment>.*), /${segment}

        - id: time-work
          uri: ${TIME_WORK_URI:http://127.0.0.1:8087}
          predicates:
            - Path=/time-work/**
          filters:
            - RewritePath=/time-work/(?<segment>.*), /${segment}

        - id: hrms-people
          uri: ${PEOPLE_URI:${HRMS_URI:http://127.0.0.1:8081}}
          predicates:
            - Path=/hrms/**
          filters:
            - RewritePath=/hrms/(?<segment>.*), /${segment}

        - id: payroll
          uri: ${PAYROLL_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/payroll/**
          filters:
            - RewritePath=/payroll/(?<segment>.*), /${segment}

        - id: notification
          uri: ${NOTIF_URI:http://127.0.0.1:8083}
          predicates:
            - Path=/notifications/**
          filters:
            - RewritePath=/notifications/(?<segment>.*), /${segment}

        - id: files
          uri: ${FILES_URI:http://127.0.0.1:8084}
          predicates:
            - Path=/files/**
          filters:
            - RewritePath=/files/(?<segment>.*), /${segment}

        - id: reports
          uri: ${REPORTS_URI:http://127.0.0.1:8085}
          predicates:
            - Path=/reports/**
          filters:
            - RewritePath=/reports/(?<segment>.*), /${segment}

platform:
  jwt:
    secret: ${JWT_SECRET}
  security:
    # Stamped by the gateway as X-Service-Key on every proxied request; services reject requests without it.
    # Clients can never set it (gateway strips and overwrites).
    service-key: ${PLATFORM_SERVICE_KEY}
  # Account picker (POST /api/registry/token, GET /hrms/api/auth/accounts) is NOT open:
  # callers must send X-Demo-Auth-Key (the Next.js BFF does, server-side). Set enabled=false to disable entirely.
  demo-auth:
    enabled: ${DEMO_AUTH_ENABLED:true}
    # Distinct from PLATFORM_SERVICE_KEY so the account-picker secret cannot bypass the gateway.
    key: ${DEMO_AUTH_KEY}
  # JWT not required for these (swagger assets + OpenAPI JSON + health). No service key is forwarded.
  public-paths:
    - /actuator/**
    - /swagger-ui/**
    - /swagger-ui.html
    - /v3/api-docs
    - /v3/api-docs/**
    - /webjars/**
    # OpenAPI JSON per service only (not arbitrary /docs/** proxying)
    - /docs/*/v3/api-docs
    - /docs/*/v3/api-docs/**
    - /api/registry/health-info
    - /registry/health-info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true
    # One Swagger UI on the gateway — pick a service from the dropdown
    urls:
      - name: Registry
        url: /docs/registry/v3/api-docs
      - name: HRMS
        url: /docs/hrms/v3/api-docs
      - name: Payroll
        url: /docs/payroll/v3/api-docs
      - name: Notification
        url: /docs/notification/v3/api-docs
      - name: Files
        url: /docs/files/v3/api-docs
      - name: Reports
        url: /docs/reports/v3/api-docs

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.platform.gateway: INFO
