# Infrastructure + optional full stack.
#
# Profiles keep each app independently deployable (large-scale ready):
#   docker compose up -d                                          # infra only
#   docker compose --profile apps --profile minio up -d --build   # full stack
# Or convenience: bash scripts/up-local.sh
#
# Production: deploy each service Dockerfile separately; Compose is local/dev only.

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres-registry:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      # Host 5435 — avoid conflict with a local Windows PostgreSQL often bound to 5432
      - "5435:5432"
    volumes:
      - ./docker/postgres/init-registry.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pg_registry_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-hrms:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres/init-hrms-host.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pg_hrms_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payroll:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - ./docker/postgres/init-payroll-host.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pg_payroll_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-platform:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - ./docker/postgres/init-platform-host.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pg_platform_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  tenant-registry:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: tenant-registry/Dockerfile
    ports:
      - "8080:8080"
    environment:
      REGISTRY_DB_URL: jdbc:postgresql://postgres-registry:5432/registry_db
      REGISTRY_DB_USER: platform
      REGISTRY_DB_PASSWORD: platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      HRMS_PG_ADMIN_URL: jdbc:postgresql://postgres-hrms:5432/postgres
      HRMS_PG_HOST: postgres-hrms
      HRMS_PG_PORT: 5432
      HRMS_PG_USER: platform
      HRMS_PG_PASSWORD: platform
      PAYROLL_PG_ADMIN_URL: jdbc:postgresql://postgres-payroll:5432/postgres
      PAYROLL_PG_HOST: postgres-payroll
      PAYROLL_PG_PORT: 5432
      PAYROLL_PG_USER: platform
      PAYROLL_PG_PASSWORD: platform
      FILES_PG_ADMIN_URL: jdbc:postgresql://postgres-platform:5432/postgres
      FILES_PG_HOST: postgres-platform
      FILES_PG_PORT: 5432
      FILES_PG_USER: platform
      FILES_PG_PASSWORD: platform
      NOTIF_PG_ADMIN_URL: jdbc:postgresql://postgres-platform:5432/postgres
      NOTIF_PG_HOST: postgres-platform
      NOTIF_PG_PORT: 5432
      NOTIF_PG_USER: platform
      NOTIF_PG_PASSWORD: platform
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      JWT_SECRET: practice-jwt-secret-change-me-32chars-min
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-local-service-key-change-me}
    depends_on:
      postgres-registry:
        condition: service_healthy
      postgres-hrms:
        condition: service_healthy
      postgres-payroll:
        condition: service_healthy
      postgres-platform:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  hrms-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: hrms-service/Dockerfile
    ports:
      - "8081:8081"
      - "9081:9081"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REGISTRY_BASE_URL: http://tenant-registry:8080
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-local-service-key-change-me}
    depends_on:
      - tenant-registry
      - redis
      - postgres-hrms

  payroll-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: payroll-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REGISTRY_BASE_URL: http://tenant-registry:8080
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-local-service-key-change-me}
      HRMS_GRPC_ADDRESS: static://hrms-service:9081
    depends_on:
      - tenant-registry
      - hrms-service
      - redis
      - postgres-payroll

  notification-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      # JDBC resolved per-tenant via registry routing → notif_<tenantId> on postgres-platform
      REDIS_HOST: redis
      REGISTRY_BASE_URL: http://tenant-registry:8080
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-local-service-key-change-me}
    depends_on:
      - tenant-registry
      - postgres-platform
      - redis

  file-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: file-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      # JDBC resolved per-tenant via registry routing → files_<tenantId> on postgres-platform
      FILE_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      REDIS_HOST: redis
      REGISTRY_BASE_URL: http://tenant-registry:8080
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-local-service-key-change-me}
    depends_on:
      - tenant-registry
      - postgres-platform
      - minio
      - redis

  report-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: report-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      # JDBC resolved per-tenant via registry routing → reports_<tenantId> on postgres-platform
      HRMS_BASE_URL: http://hrms-service:8081
      REDIS_HOST: redis
      REGISTRY_BASE_URL: http://tenant-registry:8080
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-local-service-key-change-me}
    depends_on:
      - tenant-registry
      - hrms-service
      - postgres-platform
      - redis

  # Object storage for file-service (bucket-per-tenant at provision)
  # Profile minio — started by scripts/up-local.sh with apps
  minio:
    image: minio/minio
    profiles: ["minio", "apps"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8090:8090"
    environment:
      REGISTRY_URI: http://tenant-registry:8080
      HRMS_URI: http://hrms-service:8081
      PAYROLL_URI: http://payroll-service:8082
      NOTIF_URI: http://notification-service:8083
      FILES_URI: http://file-service:8084
      REPORTS_URI: http://report-service:8085
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-true}
      DEMO_AUTH_KEY: ${DEMO_AUTH_KEY:-local-service-key-change-me}
      JWT_SECRET: practice-jwt-secret-change-me-32chars-min
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY:-local-service-key-change-me}
    depends_on:
      - tenant-registry
      - hrms-service
      - payroll-service
      - notification-service
      - file-service
      - report-service

  qii-frontend:
    profiles: ["apps"]
    build:
      context: ./frontend/qii-hrms
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      TENANT_ID: qii_creative
      GATEWAY_URL: http://api-gateway:8090
      DEMO_AUTH_KEY: ${DEMO_AUTH_KEY:-local-service-key-change-me}
      COOKIE_NAME: qii_session
      NODE_ENV: production
    depends_on:
      - api-gateway

volumes:
  pg_registry_data:
  pg_hrms_data:
  pg_payroll_data:
  pg_platform_data:
  minio_data:
