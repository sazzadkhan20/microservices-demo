# Qii HRMS — single company, one fixed database per service (guide §1, §3, §5).
#
# Secrets: set in repo-root `.env` (see `.env.example`). Compose embeds no credential literals.
#   docker compose up -d                          # infrastructure only (IDE / bootRun apps)
#   docker compose --profile apps up -d --build   # full stack
#   bash scripts/up-local.sh                      # convenience wrapper
#
# Database layout (a shared PostgreSQL cluster is acceptable initially — guide §1):
#   postgres-hrms     people_db, leave_db, timework_db
#   postgres-payroll  payroll_db
#   postgres-platform files_db, notification_db, reports_db
# Each database has its own <svc>_migrator (schema owner, Liquibase only) and <svc>_app (DML only) role,
# created on first boot by docker/postgres/init-service-dbs.sh. Services migrate their own schema on startup.
#
# Local-only: ports are published on 127.0.0.1 for IDE runs. In production only the HTTPS ingress → BFF
# is public; databases, broker, Redis, object storage and service ports stay on a private network (guide §9).

services:
  # Gateway session revocation store (logout / offboarding).
  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Guide §1/§7 — durable broker with publisher confirms + consumer acks (management UI :15672).
  rabbitmq:
    image: rabbitmq:3.13-management
    restart: unless-stopped
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres-hrms:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SERVICE_DBS: "people_db:PEOPLE leave_db:LEAVE timework_db:TIMEWORK"
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD}
      PEOPLE_DB_MIGRATION_PASSWORD: ${PEOPLE_DB_MIGRATION_PASSWORD}
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD}
      LEAVE_DB_MIGRATION_PASSWORD: ${LEAVE_DB_MIGRATION_PASSWORD}
      TIMEWORK_DB_PASSWORD: ${TIMEWORK_DB_PASSWORD}
      TIMEWORK_DB_MIGRATION_PASSWORD: ${TIMEWORK_DB_MIGRATION_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ./docker/postgres/init-service-dbs.sh:/docker-entrypoint-initdb.d/01-init-service-dbs.sh:ro
      - ./docker/postgres/service-db.sql:/docker-entrypoint-initdb.d/service-db.sql.tpl:ro
      - pg_hrms_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-payroll:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SERVICE_DBS: "payroll_db:PAYROLL"
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD}
      PAYROLL_DB_MIGRATION_PASSWORD: ${PAYROLL_DB_MIGRATION_PASSWORD}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - ./docker/postgres/init-service-dbs.sh:/docker-entrypoint-initdb.d/01-init-service-dbs.sh:ro
      - ./docker/postgres/service-db.sql:/docker-entrypoint-initdb.d/service-db.sql.tpl:ro
      - pg_payroll_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-platform:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      SERVICE_DBS: "files_db:FILES notification_db:NOTIFICATION reports_db:REPORT"
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD}
      FILES_DB_MIGRATION_PASSWORD: ${FILES_DB_MIGRATION_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_MIGRATION_PASSWORD: ${NOTIFICATION_DB_MIGRATION_PASSWORD}
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
      REPORT_DB_MIGRATION_PASSWORD: ${REPORT_DB_MIGRATION_PASSWORD}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - ./docker/postgres/init-service-dbs.sh:/docker-entrypoint-initdb.d/01-init-service-dbs.sh:ro
      - ./docker/postgres/service-db.sql:/docker-entrypoint-initdb.d/service-db.sql.tpl:ro
      - pg_platform_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Private object storage for company documents (file-service, bucket FILE_STORAGE_BUCKET).
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    pull_policy: if_not_present
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # Guide §3 — People / Leave / Time&Work / Payroll / Documents / Notifications / Reporting,
  # each an independent deployable with its own fixed database connection.
  people-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: people-service/Dockerfile
    ports:
      # 8081 = HTTP/actuator (health probes). 9081 = gRPC only (Payroll → People). Never HTTP-probe 9081.
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:9081:9081"
    environment:
      PEOPLE_DB_URL: jdbc:postgresql://postgres-hrms:5432/people_db
      PEOPLE_DB_USER: people_app
      PEOPLE_DB_PASSWORD: ${PEOPLE_DB_PASSWORD}
      PEOPLE_DB_MIGRATION_USER: people_migrator
      PEOPLE_DB_MIGRATION_PASSWORD: ${PEOPLE_DB_MIGRATION_PASSWORD}
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PLATFORM_MESSAGING_ENABLED: ${PLATFORM_MESSAGING_ENABLED:-true}
      GATEWAY_BASE_URL: http://api-gateway:8090
      LEAVE_BASE_URL: http://leave-service:8086
      TIME_WORK_BASE_URL: http://time-work-service:8087
      PAYROLL_BASE_URL: http://payroll-service:8082
      FILES_BASE_URL: http://file-service:8084
      NOTIFICATION_BASE_URL: http://notification-service:8083
      REPORT_BASE_URL: http://report-service:8085
    depends_on:
      postgres-hrms:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  leave-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: leave-service/Dockerfile
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      LEAVE_DB_URL: jdbc:postgresql://postgres-hrms:5432/leave_db
      LEAVE_DB_USER: leave_app
      LEAVE_DB_PASSWORD: ${LEAVE_DB_PASSWORD}
      LEAVE_DB_MIGRATION_USER: leave_migrator
      LEAVE_DB_MIGRATION_PASSWORD: ${LEAVE_DB_MIGRATION_PASSWORD}
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PLATFORM_MESSAGING_ENABLED: ${PLATFORM_MESSAGING_ENABLED:-true}
      TIME_WORK_BASE_URL: http://time-work-service:8087
      PEOPLE_BASE_URL: http://people-service:8081
      HRMS_BASE_URL: http://people-service:8081
    depends_on:
      postgres-hrms:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  time-work-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: time-work-service/Dockerfile
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      TIMEWORK_DB_URL: jdbc:postgresql://postgres-hrms:5432/timework_db
      TIMEWORK_DB_USER: timework_app
      TIMEWORK_DB_PASSWORD: ${TIMEWORK_DB_PASSWORD}
      TIMEWORK_DB_MIGRATION_USER: timework_migrator
      TIMEWORK_DB_MIGRATION_PASSWORD: ${TIMEWORK_DB_MIGRATION_PASSWORD}
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PLATFORM_MESSAGING_ENABLED: ${PLATFORM_MESSAGING_ENABLED:-true}
      LEAVE_BASE_URL: http://leave-service:8086
      PEOPLE_BASE_URL: http://people-service:8081
      HRMS_BASE_URL: http://people-service:8081
    depends_on:
      postgres-hrms:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payroll-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: payroll-service/Dockerfile
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      PAYROLL_DB_URL: jdbc:postgresql://postgres-payroll:5432/payroll_db
      PAYROLL_DB_USER: payroll_app
      PAYROLL_DB_PASSWORD: ${PAYROLL_DB_PASSWORD}
      PAYROLL_DB_MIGRATION_USER: payroll_migrator
      PAYROLL_DB_MIGRATION_PASSWORD: ${PAYROLL_DB_MIGRATION_PASSWORD}
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      HRMS_BASE_URL: http://people-service:8081
      TIME_WORK_BASE_URL: http://time-work-service:8087
      LEAVE_BASE_URL: http://leave-service:8086
      HRMS_GRPC_ADDRESS: static://people-service:9081
      NOTIFICATION_BASE_URL: http://notification-service:8083
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PLATFORM_MESSAGING_ENABLED: ${PLATFORM_MESSAGING_ENABLED:-true}
    depends_on:
      postgres-payroll:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      people-service:
        condition: service_started

  notification-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres-platform:5432/notification_db
      NOTIFICATION_DB_USER: notification_app
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_MIGRATION_USER: notification_migrator
      NOTIFICATION_DB_MIGRATION_PASSWORD: ${NOTIFICATION_DB_MIGRATION_PASSWORD}
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PLATFORM_MESSAGING_ENABLED: ${PLATFORM_MESSAGING_ENABLED:-true}
    depends_on:
      postgres-platform:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  file-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: file-service/Dockerfile
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      FILES_DB_URL: jdbc:postgresql://postgres-platform:5432/files_db
      FILES_DB_USER: files_app
      FILES_DB_PASSWORD: ${FILES_DB_PASSWORD}
      FILES_DB_MIGRATION_USER: files_migrator
      FILES_DB_MIGRATION_PASSWORD: ${FILES_DB_MIGRATION_PASSWORD}
      FILE_STORAGE_TYPE: minio
      FILE_STORAGE_BUCKET: ${FILE_STORAGE_BUCKET:-qii-hrms-documents}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      FILE_DOWNLOAD_SIGNING_KEY: ${FILE_DOWNLOAD_SIGNING_KEY:-${JWT_SECRET}}
      PEOPLE_BASE_URL: http://people-service:8081
      HRMS_BASE_URL: http://people-service:8081
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PLATFORM_MESSAGING_ENABLED: ${PLATFORM_MESSAGING_ENABLED:-true}
    depends_on:
      postgres-platform:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      people-service:
        condition: service_started

  report-service:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: report-service/Dockerfile
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      REPORT_DB_URL: jdbc:postgresql://postgres-platform:5432/reports_db
      REPORT_DB_USER: report_app
      REPORT_DB_PASSWORD: ${REPORT_DB_PASSWORD}
      REPORT_DB_MIGRATION_USER: report_migrator
      REPORT_DB_MIGRATION_PASSWORD: ${REPORT_DB_MIGRATION_PASSWORD}
      HRMS_BASE_URL: http://people-service:8081
      TIME_WORK_BASE_URL: http://time-work-service:8087
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      PLATFORM_MESSAGING_ENABLED: ${PLATFORM_MESSAGING_ENABLED:-true}
    depends_on:
      postgres-platform:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Sole public entry behind the BFF: verifies session JWTs, mints demo sessions, routes to services.
  api-gateway:
    profiles: ["apps"]
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      PEOPLE_URI: http://people-service:8081
      LEAVE_URI: http://leave-service:8086
      TIME_WORK_URI: http://time-work-service:8087
      PAYROLL_URI: http://payroll-service:8082
      NOTIF_URI: http://notification-service:8083
      FILES_URI: http://file-service:8084
      REPORTS_URI: http://report-service:8085
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_AUTH_KEY: ${DEMO_AUTH_KEY}
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-604800}
      PLATFORM_SERVICE_KEY: ${PLATFORM_SERVICE_KEY}
      PLATFORM_INTERNAL_KEY: ${PLATFORM_INTERNAL_KEY}
      PLATFORM_ADMIN_KEY: ${PLATFORM_ADMIN_KEY}
    depends_on:
      redis:
        condition: service_healthy
      people-service:
        condition: service_started

  qii-frontend:
    profiles: ["apps"]
    build:
      context: ./frontend/qii-hrms
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      GATEWAY_URL: http://api-gateway:8090
      DEMO_AUTH_KEY: ${DEMO_AUTH_KEY}
      COOKIE_NAME: qii_session
      NODE_ENV: production
    depends_on:
      - api-gateway

volumes:
  pg_hrms_data:
  pg_payroll_data:
  pg_platform_data:
  minio_data:
  rabbitmq_data:
