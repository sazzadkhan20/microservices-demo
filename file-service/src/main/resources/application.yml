server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: file-service
  # Guide §1/§5 — one fixed database owned by this service. Runtime uses a restricted DML role;
  # Liquibase uses a separate schema-owner (migration) role. Credentials come from env / secrets manager.
  datasource:
    url: ${FILES_DB_URL:jdbc:postgresql://127.0.0.1:5436/files_db}
    username: ${FILES_DB_USER:files_app}
    password: ${FILES_DB_PASSWORD}
    hikari:
      pool-name: files-db
      maximum-pool-size: ${FILES_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 120000
      leak-detection-threshold: 60000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${FILES_DB_MIGRATION_USER:files_migrator}
    password: ${FILES_DB_MIGRATION_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 5
          multiplier: 2.0
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3
        multiplier: 2.0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

platform:
  people-base-url: ${PEOPLE_BASE_URL:${HRMS_BASE_URL:http://127.0.0.1:8081}}
  messaging:
    enabled: ${PLATFORM_MESSAGING_ENABLED:true}
  security:
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY}
    internal-key: ${PLATFORM_INTERNAL_KEY}

file:
  storage:
    type: ${FILE_STORAGE_TYPE:minio}
    root: ${FILE_STORAGE_ROOT:./data/files}
    # Single private bucket for company documents (guide §8). Objects keep their bucket in storage_key.
    bucket: ${FILE_STORAGE_BUCKET:qii-hrms-documents}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
  # Guide §8 — short-lived download tokens after authorization
  download:
    signing-key: ${FILE_DOWNLOAD_SIGNING_KEY:${JWT_SECRET}}
    ttl-seconds: ${FILE_DOWNLOAD_TTL_SECONDS:120}
  retention:
    enabled: ${FILE_RETENTION_ENABLED:true}
    rejected-days: ${FILE_RETENTION_REJECTED_DAYS:30}
    stuck-scan-minutes: ${FILE_STUCK_SCAN_MINUTES:15}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.platform.files: INFO
