# File read-path indexes (SRS NFR-07, measured on a 3-year dataset).
# Read-path indexes only: no column, constraint or data change, so query results are identical.
# Plain CREATE INDEX inside the changeset transaction (atomic, rolls back cleanly). The database is
# owned by this service and Liquibase runs before it accepts traffic; at 3-year volume every build
# takes well under a second. IF NOT EXISTS keeps the changeset safe to re-apply. See docs/DATABASE_INDEXING.md.
databaseChangeLog:
  - changeSet:
      id: files-002-idx_file_scan_status_created
      author: qii-hrms
      dbms: postgresql
      comment: "Scan sweeper findByScanStatus(In)AndCreatedAtBefore: seq scan 0.9 -> 0.15 ms"
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_file_scan_status_created ON file_object (scan_status, created_at)
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_file_scan_status_created
