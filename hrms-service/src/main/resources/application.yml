server:
  port: 8081

# gRPC server for Payroll → HRMS internal calls
grpc:
  server:
    port: 9081

spring:
  application:
    name: hrms-service
  # Multi-tenant: DataSource is AbstractRoutingDataSource (no single fixed JDBC URL).
  autoconfigure:
    exclude: []
  liquibase:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        # Avoid requiring a live connection during bootstrap before any tenant exists
        boot:
          allow_jdbc_metadata_access: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

platform:
  service-name: hrms
  security:
    # Requests (REST + gRPC) must carry X-Service-Key = this value (stamped by the gateway).
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}
    internal-key: ${PLATFORM_INTERNAL_KEY:local-internal-key-change-me}
  registry:
    base-url: ${REGISTRY_BASE_URL:http://localhost:8080}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}
  datasource:
    # Pool settings applied to each tenant DataSource created at runtime
    maximum-pool-size: 5
    minimum-idle: 1
    max-lifetime-ms: 1800000
  cache:
    l1-max-size: 50
    l1-expire-after-access-minutes: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.platform.hrms: INFO
