server:
  port: 8086
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    # Bounded worker budget (guide §7); saturation is visible via tomcat.threads.* metrics.
    threads:
      max: ${SERVER_MAX_THREADS:200}
      min-spare: 10
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    connection-timeout: 20s
    keep-alive-timeout: 20s
    mbeanregistry:
      enabled: true

spring:
  application:
    name: leave-service
  # Guide §1/§5 — one fixed database owned by this service. Runtime uses a restricted DML role;
  # Liquibase uses a separate schema-owner (migration) role. Credentials come from env / secrets manager.
  datasource:
    url: ${LEAVE_DB_URL:jdbc:postgresql://127.0.0.1:5433/leave_db}
    username: ${LEAVE_DB_USER:leave_app}
    password: ${LEAVE_DB_PASSWORD}
    hikari:
      pool-name: leave-db
      maximum-pool-size: ${LEAVE_DB_POOL_SIZE:15}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 120000
      leak-detection-threshold: 60000
      # Guide §7: no runaway statement, lock wait or abandoned transaction can pin a pooled connection.
      connection-init-sql: "SET statement_timeout = '${DB_STATEMENT_TIMEOUT:60s}'; SET lock_timeout = '${DB_LOCK_TIMEOUT:15s}'; SET idle_in_transaction_session_timeout = '${DB_IDLE_TX_TIMEOUT:120s}'"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${LEAVE_DB_MIGRATION_USER:leave_migrator}
    password: ${LEAVE_DB_MIGRATION_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 5
          multiplier: 2.0
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3
        multiplier: 2.0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 32
        query:
          in_clause_parameter_padding: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerFactoryAutoConfiguration
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerAutoConfiguration

platform:
  time-work-base-url: ${TIME_WORK_BASE_URL:http://127.0.0.1:8087}
  people-base-url: ${PEOPLE_BASE_URL:${HRMS_BASE_URL:http://127.0.0.1:8081}}
  hrms-base-url: ${HRMS_BASE_URL:http://127.0.0.1:8081}
  messaging:
    enabled: ${PLATFORM_MESSAGING_ENABLED:true}
  security:
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY}
    internal-key: ${PLATFORM_INTERNAL_KEY}
    admin-key: ${PLATFORM_ADMIN_KEY}

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,800ms,2s
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    # Guide §9: correlation id on every log line (MDC set by CorrelationIdFilter / message consumers).
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
  level:
    com.platform.leave: INFO
