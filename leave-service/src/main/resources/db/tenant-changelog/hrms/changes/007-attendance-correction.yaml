databaseChangeLog:
  - changeSet:
      id: hrms-007-attendance-correction
      author: platform
      changes:
        - createTable:
            tableName: attendance_correction
            columns:
              - column: { name: id, type: BIGSERIAL, constraints: { primaryKey: true } }
              - column: { name: employee_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: work_date, type: DATE, constraints: { nullable: false } }
              - column: { name: requested_check_in, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: requested_check_out, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: reason, type: VARCHAR(512), constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(16), defaultValue: PENDING, constraints: { nullable: false } }
              - column: { name: reviewer_id, type: BIGINT }
              - column: { name: review_note, type: VARCHAR(512) }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - createIndex:
            tableName: attendance_correction
            indexName: idx_att_corr_status
            columns:
              - column: { name: status }
              - column: { name: work_date }
        - createIndex:
            tableName: attendance_correction
            indexName: idx_att_corr_employee
            columns:
              - column: { name: employee_id }
