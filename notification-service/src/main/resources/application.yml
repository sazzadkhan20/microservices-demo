server:
  port: 8083

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5436/notif_platform}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USER:platform}
    password: ${SPRING_DATASOURCE_PASSWORD:platform}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

platform:
  security:
    # Requests must carry X-Service-Key = this value (stamped by the gateway or HRMS).
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}

notification:
  registry:
    base-url: ${REGISTRY_BASE_URL:http://127.0.0.1:8080}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}
  service-name: notification

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.platform.notification: INFO
