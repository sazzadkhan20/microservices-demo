# Notification read-path indexes (SRS NFR-07, measured on a 3-year dataset).
# Read-path indexes only: no column, constraint or data change, so query results are identical.
# Plain CREATE INDEX inside the changeset transaction (atomic, rolls back cleanly). The database is
# owned by this service and Liquibase runs before it accepts traffic; at 3-year volume every build
# takes well under a second. IF NOT EXISTS keeps the changeset safe to re-apply. See docs/DATABASE_INDEXING.md.
databaseChangeLog:
  - changeSet:
      id: notification-002-idx_notif_employee_created
      author: qii-hrms
      dbms: postgresql
      comment: "Inbox page findByEmployeeIdOrderByCreatedAtDesc: sort 3.7 -> 0.06 ms"
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_notif_employee_created ON notifications (employee_id, created_at DESC)
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_notif_employee_created
  - changeSet:
      id: notification-002-idx_notif_employee_unread
      author: qii-hrms
      dbms: postgresql
      comment: "Bell badge countByEmployeeIdAndReadFlagFalse on every page: 2.8 -> 0.06 ms"
      changes:
        - sql:
            sql: CREATE INDEX IF NOT EXISTS idx_notif_employee_unread ON notifications (employee_id) WHERE read_flag = false
      rollback:
        - sql:
            sql: DROP INDEX IF EXISTS idx_notif_employee_unread
