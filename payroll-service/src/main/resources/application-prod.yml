# Activate with SPRING_PROFILES_ACTIVE=prod
# Requires strong secrets and per-service DB credentials (PAYROLL_DB_*).
platform:
  security:
    require-gateway: true
  messaging:
    enabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

logging:
  level:
    root: INFO
    com.platform: INFO
