server:
  port: 8082

spring:
  application:
    name: payroll-service
  liquibase:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        boot:
          allow_jdbc_metadata_access: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

# gRPC client → HRMS
grpc:
  client:
    hrmsEmployee:
      address: ${HRMS_GRPC_ADDRESS:static://localhost:9081}
      negotiationType: plaintext

payroll:
  hrms-base-url: ${HRMS_BASE_URL:http://127.0.0.1:8081}

platform:
  service-name: payroll
  security:
    # Requests must carry X-Service-Key = this value (stamped by the gateway); also sent to HRMS gRPC.
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}
    internal-key: ${PLATFORM_INTERNAL_KEY:local-internal-key-change-me}
  registry:
    base-url: ${REGISTRY_BASE_URL:http://localhost:8080}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}
  datasource:
    maximum-pool-size: 5
    minimum-idle: 1
    max-lifetime-ms: 1800000
  cache:
    l1-max-size: 50
    l1-expire-after-access-minutes: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.platform.payroll: INFO
