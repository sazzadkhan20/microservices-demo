server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: payroll-service
  # Guide §1/§5 — one fixed database owned by this service. Runtime uses a restricted DML role;
  # Liquibase uses a separate schema-owner (migration) role. Credentials come from env / secrets manager.
  datasource:
    url: ${PAYROLL_DB_URL:jdbc:postgresql://127.0.0.1:5434/payroll_db}
    username: ${PAYROLL_DB_USER:payroll_app}
    password: ${PAYROLL_DB_PASSWORD}
    hikari:
      pool-name: payroll-db
      maximum-pool-size: ${PAYROLL_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 120000
      leak-detection-threshold: 60000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${PAYROLL_DB_MIGRATION_USER:payroll_migrator}
    password: ${PAYROLL_DB_MIGRATION_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 5
          multiplier: 2.0
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3
        multiplier: 2.0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

# gRPC client → HRMS
grpc:
  client:
    hrmsEmployee:
      address: ${HRMS_GRPC_ADDRESS:static://localhost:9081}
      negotiationType: plaintext

payroll:
  hrms-base-url: ${HRMS_BASE_URL:http://127.0.0.1:8081}
  time-work-base-url: ${TIME_WORK_BASE_URL:http://127.0.0.1:8087}
  leave-base-url: ${LEAVE_BASE_URL:http://127.0.0.1:8086}

platform:
  messaging:
    enabled: ${PLATFORM_MESSAGING_ENABLED:true}
    outbox-poll-ms: 1000
    finalize-wait-seconds: 25
  payroll:
    finalize-warn-minutes: ${PAYROLL_FINALIZE_WARN_MINUTES:5}
    finalize-action-required-minutes: ${PAYROLL_FINALIZE_ACTION_REQUIRED_MINUTES:30}
    finalize-recovery-interval-ms: ${PAYROLL_FINALIZE_RECOVERY_INTERVAL_MS:60000}
  notification:
    # Empty = log-only (finalize still succeeds). Points at notification-service.
    base-url: ${NOTIFICATION_BASE_URL:http://127.0.0.1:8083}
  security:
    # Requests must carry X-Service-Key = this value (stamped by the gateway); also sent to HRMS gRPC.
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY}
    internal-key: ${PLATFORM_INTERNAL_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.platform.payroll: INFO
