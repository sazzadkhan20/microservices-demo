server:
  port: 8082

spring:
  application:
    name: payroll-service
  liquibase:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        boot:
          allow_jdbc_metadata_access: false
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

# gRPC client → HRMS
grpc:
  client:
    hrmsEmployee:
      address: ${HRMS_GRPC_ADDRESS:static://localhost:9081}
      negotiationType: plaintext

platform:
  service-name: payroll
  registry:
    base-url: ${REGISTRY_BASE_URL:http://localhost:8080}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}
  datasource:
    maximum-pool-size: 5
    minimum-idle: 1
    max-lifetime-ms: 1800000
  cache:
    l1-max-size: 50
    l1-expire-after-access-minutes: 5

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.platform.payroll: INFO
