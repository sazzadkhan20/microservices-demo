# docs/PAYROLL_SPEC.md §2.2 — month payroll runs, typed settings, salary records, adjustments,
# append-only finalised revisions and run-level finalise/reopen operations (guide §5, §6).
# EXPAND step: new tables only. Legacy payslip / finalize_operation / payroll_config are dropped in 003.
databaseChangeLog:
  - changeSet:
      id: payroll-002-settings
      author: qii-hrms
      changes:
        - sql:
            sql: |
              CREATE TABLE payroll_settings (
                id                   smallint PRIMARY KEY CHECK (id = 1),
                per_day_rate_basis   varchar(16) NOT NULL DEFAULT 'WORKING_DAYS'
                                       CHECK (per_day_rate_basis IN ('WORKING_DAYS', 'CALENDAR_30')),
                absence_rule         varchar(16) NOT NULL DEFAULT 'BALANCE_FIRST'
                                       CHECK (absence_rule IN ('BALANCE_FIRST', 'DIRECT')),
                absence_cover_order  jsonb       NOT NULL DEFAULT '["CASUAL", "ANNUAL"]'::jsonb
                                       CHECK (jsonb_typeof(absence_cover_order) = 'array'),
                notify_payslip_ready boolean     NOT NULL DEFAULT true,
                updated_at           timestamptz NOT NULL DEFAULT now(),
                updated_by           bigint,
                version              bigint      NOT NULL DEFAULT 0
              );
              -- SRS defaults (BR-15, BR-16, FR-PAY-04, FR-NT-11): no extra deductions.
              INSERT INTO payroll_settings (id) VALUES (1);

  - changeSet:
      id: payroll-002-salary-record
      author: qii-hrms
      changes:
        - sql:
            sql: |
              CREATE TABLE salary_record (
                id             bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                employee_id    bigint        NOT NULL,
                effective_date date          NOT NULL,
                pay_type       varchar(16)   NOT NULL CHECK (pay_type IN ('MONTHLY', 'HOURLY')),
                amount         numeric(19,2) NOT NULL CHECK (amount > 0),
                currency       varchar(3)    NOT NULL CHECK (currency IN ('BDT', 'AUD')),
                reason         varchar(512)  NOT NULL,
                set_by         bigint,
                created_at     timestamptz   NOT NULL DEFAULT now(),
                CONSTRAINT uq_salary_record_employee_date UNIQUE (employee_id, effective_date)
              );
              CREATE INDEX idx_salary_record_employee ON salary_record (employee_id, effective_date DESC);

              -- Carry the latest legacy salary_history row per employee and effective date (duplicates
              -- in the legacy table are collapsed). Invalid legacy currency/amount rows are skipped.
              INSERT INTO salary_record (employee_id, effective_date, pay_type, amount, currency, reason, set_by, created_at)
              SELECT DISTINCT ON (employee_id, effective_date)
                     employee_id, effective_date, upper(pay_type), round(amount, 2), upper(currency),
                     coalesce(nullif(note, ''), 'Migrated from salary history'), created_by, created_at
              FROM salary_history
              WHERE amount > 0 AND upper(currency) IN ('BDT', 'AUD') AND upper(pay_type) IN ('MONTHLY', 'HOURLY')
              ORDER BY employee_id, effective_date, created_at DESC, id DESC;

  - changeSet:
      id: payroll-002-runs
      author: qii-hrms
      changes:
        - sql:
            sql: |
              CREATE TABLE payroll_run (
                id                     bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                period                 char(7)     NOT NULL CHECK (period ~ '^[0-9]{4}-(0[1-9]|1[0-2])$'),
                status                 varchar(16) NOT NULL DEFAULT 'DRAFT'
                                         CHECK (status IN ('DRAFT', 'FINALIZING', 'FINALIZED', 'REOPENING', 'ACTION_REQUIRED')),
                revision               bigint      NOT NULL DEFAULT 0 CHECK (revision >= 0),
                calculated_at          timestamptz,
                calculated_by          bigint,
                finalized_at           timestamptz,
                finalized_by           bigint,
                reopened_at            timestamptz,
                reopened_by            bigint,
                reopen_reason          varchar(512),
                operation_id           varchar(64),
                action_required_reason text,
                created_at             timestamptz NOT NULL DEFAULT now(),
                updated_at             timestamptz NOT NULL DEFAULT now(),
                version                bigint      NOT NULL DEFAULT 0,
                CONSTRAINT uq_payroll_run_period UNIQUE (period)
              );

              CREATE TABLE payroll_line (
                id                bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                run_id            bigint        NOT NULL REFERENCES payroll_run (id),
                employee_id       bigint        NOT NULL,
                employee_code     varchar(64),
                employee_name     varchar(256),
                currency          varchar(3),
                pay_type          varchar(16)   CHECK (pay_type IN ('MONTHLY', 'HOURLY')),
                working_days      numeric(6,2)  NOT NULL DEFAULT 0,
                days_employed     numeric(6,2)  NOT NULL DEFAULT 0,
                per_day_rate      numeric(19,2),
                hourly_rate       numeric(19,2),
                hours_worked      numeric(8,2)  NOT NULL DEFAULT 0,
                absent_days       numeric(6,2)  NOT NULL DEFAULT 0,
                covered_days      numeric(6,2)  NOT NULL DEFAULT 0,
                unpaid_leave_days numeric(6,2)  NOT NULL DEFAULT 0,
                deducted_days     numeric(6,2)  NOT NULL DEFAULT 0,
                base_pay          numeric(19,2) NOT NULL DEFAULT 0,
                deduction         numeric(19,2) NOT NULL DEFAULT 0 CHECK (deduction >= 0),
                adjustment        numeric(19,2) NOT NULL DEFAULT 0,
                adjustment_note   varchar(512),
                net_pay           numeric(19,2) NOT NULL DEFAULT 0,
                exception         boolean       NOT NULL DEFAULT false,
                notes             jsonb         NOT NULL DEFAULT '[]'::jsonb,
                covers            jsonb         NOT NULL DEFAULT '[]'::jsonb,
                calc              jsonb         NOT NULL DEFAULT '{}'::jsonb,
                facts             jsonb         NOT NULL DEFAULT '{}'::jsonb,
                status            varchar(16)   NOT NULL DEFAULT 'DRAFT' CHECK (status IN ('DRAFT', 'FINALIZED')),
                revision          bigint        NOT NULL DEFAULT 0,
                calculated_at     timestamptz   NOT NULL DEFAULT now(),
                CONSTRAINT uq_payroll_line_run_employee UNIQUE (run_id, employee_id)
              );
              CREATE INDEX idx_payroll_line_employee ON payroll_line (employee_id);

              CREATE TABLE payroll_adjustment (
                id          bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                period      char(7)       NOT NULL,
                employee_id bigint        NOT NULL,
                amount      numeric(19,2) NOT NULL CHECK (amount <> 0),
                note        varchar(512)  NOT NULL CHECK (length(trim(note)) > 0),
                created_by  bigint,
                created_at  timestamptz   NOT NULL DEFAULT now(),
                updated_by  bigint,
                updated_at  timestamptz   NOT NULL DEFAULT now(),
                CONSTRAINT uq_payroll_adjustment_period_employee UNIQUE (period, employee_id)
              );

              CREATE TABLE payslip_revision (
                id                      bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                run_id                  bigint        NOT NULL REFERENCES payroll_run (id),
                period                  char(7)       NOT NULL,
                employee_id             bigint        NOT NULL,
                run_revision            bigint        NOT NULL,
                currency                varchar(3),
                net_pay                 numeric(19,2) NOT NULL,
                snapshot                jsonb         NOT NULL,
                finalized_at            timestamptz   NOT NULL,
                finalized_by            bigint,
                operation_id            varchar(64)   NOT NULL,
                superseded_at           timestamptz,
                superseded_by_operation varchar(64),
                CONSTRAINT uq_payslip_revision UNIQUE (run_id, run_revision, employee_id)
              );
              CREATE INDEX idx_payslip_revision_employee ON payslip_revision (employee_id, period);

              CREATE TABLE payroll_operation (
                id           bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                operation_id varchar(64)  NOT NULL,
                operation_key varchar(160) NOT NULL,
                run_id       bigint       NOT NULL REFERENCES payroll_run (id),
                period       char(7)      NOT NULL,
                revision     bigint       NOT NULL,
                action       varchar(16)  NOT NULL CHECK (action IN ('FINALIZE', 'REOPEN')),
                status       varchar(16)  NOT NULL CHECK (status IN ('PENDING', 'SUCCEEDED', 'REJECTED', 'RESOLVED')),
                reverse_of_key varchar(160),
                command      jsonb        NOT NULL DEFAULT '{}'::jsonb,
                result       jsonb,
                error        text,
                attempts     integer      NOT NULL DEFAULT 1,
                last_sent_at timestamptz  NOT NULL DEFAULT now(),
                correlation_id varchar(64),
                initiated_by bigint,
                resolved_by  bigint,
                resolve_reason varchar(512),
                created_at   timestamptz  NOT NULL DEFAULT now(),
                completed_at timestamptz,
                CONSTRAINT uq_payroll_operation_id UNIQUE (operation_id),
                CONSTRAINT uq_payroll_operation_key UNIQUE (operation_key)
              );
              CREATE INDEX idx_payroll_operation_pending ON payroll_operation (status, last_sent_at);
