server:
  # REST + Spring Actuator (/actuator/health). Use THIS port for HTTP health probes.
  port: 8081
  shutdown: graceful
  max-http-request-header-size: 16KB
  tomcat:
    # Bounded worker budget (guide §7); saturation is visible via tomcat.threads.* metrics.
    threads:
      max: ${SERVER_MAX_THREADS:200}
      min-spare: 10
    accept-count: ${SERVER_ACCEPT_COUNT:100}
    connection-timeout: 20s
    keep-alive-timeout: 20s
    mbeanregistry:
      enabled: true

# gRPC only (Payroll → People employee/RBAC). HTTP clients that hit this port
# (browsers, IDE "open port", curl /actuator/health) get a protocol rejection — that is expected, not an outage.
grpc:
  server:
    port: 9081
    # Standard gRPC health (grpc.health.v1) for real gRPC probes — not HTTP actuator.
    health-service-enabled: true

spring:
  application:
    name: people-service
  # Guide §1/§5 — one fixed database owned by this service. Runtime uses a restricted DML role;
  # Liquibase uses a separate schema-owner (migration) role. Credentials come from env / secrets manager.
  datasource:
    url: ${PEOPLE_DB_URL:jdbc:postgresql://127.0.0.1:5433/people_db}
    username: ${PEOPLE_DB_USER:people_app}
    password: ${PEOPLE_DB_PASSWORD}
    hikari:
      pool-name: people-db
      maximum-pool-size: ${PEOPLE_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      # Keepalive + maxLifetime below typical Docker/NAT idle drops; avoids stale "connection has been closed"
      # after laptop sleep / long idle (OutboxRelay was failing with 10m housekeeper clock-leap warnings).
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 120000
      leak-detection-threshold: 60000
      # Guide §7: no runaway statement, lock wait or abandoned transaction can pin a pooled connection.
      connection-init-sql: "SET statement_timeout = '${DB_STATEMENT_TIMEOUT:60s}'; SET lock_timeout = '${DB_LOCK_TIMEOUT:15s}'; SET idle_in_transaction_session_timeout = '${DB_IDLE_TX_TIMEOUT:120s}'"
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${PEOPLE_DB_MIGRATION_USER:people_migrator}
    password: ${PEOPLE_DB_MIGRATION_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 5
          multiplier: 2.0
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3
        multiplier: 2.0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 32
        query:
          in_clause_parameter_padding: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

# FR-EMP-10 — deferred manager/approval handover after exitDate (daily 02:00 Asia/Dhaka by default).
# Reporting-line due job — same cron/zone: flip future-dated manager_id + move that applicant's pending approvals.
people:
  offboarding:
    handover-job-enabled: ${PEOPLE_OFFBOARDING_HANDOVER_JOB_ENABLED:true}
    handover-cron: ${PEOPLE_OFFBOARDING_HANDOVER_CRON:0 0 2 * * *}
    handover-zone: ${PEOPLE_OFFBOARDING_HANDOVER_ZONE:Asia/Dhaka}
  reporting-line:
    due-job-enabled: ${PEOPLE_REPORTING_LINE_DUE_JOB_ENABLED:true}
    due-cron: ${PEOPLE_REPORTING_LINE_DUE_CRON:${PEOPLE_OFFBOARDING_HANDOVER_CRON:0 0 2 * * *}}
    due-zone: ${PEOPLE_REPORTING_LINE_DUE_ZONE:${PEOPLE_OFFBOARDING_HANDOVER_ZONE:Asia/Dhaka}}

platform:
  gateway-base-url: ${GATEWAY_BASE_URL:http://127.0.0.1:8090}
  leave-base-url: ${LEAVE_BASE_URL:http://127.0.0.1:8086}
  time-work-base-url: ${TIME_WORK_BASE_URL:http://127.0.0.1:8087}
  payroll-base-url: ${PAYROLL_BASE_URL:http://127.0.0.1:8082}
  files-base-url: ${FILES_BASE_URL:http://127.0.0.1:8084}
  notification-base-url: ${NOTIFICATION_BASE_URL:http://127.0.0.1:8083}
  report-base-url: ${REPORT_BASE_URL:http://127.0.0.1:8085}
  employee-projection:
    publisher: true
  messaging:
    enabled: ${PLATFORM_MESSAGING_ENABLED:true}
    outbox-poll-ms: 1000
  security:
    # Requests (REST + gRPC) must carry X-Service-Key = this value (stamped by the gateway).
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY}
    internal-key: ${PLATFORM_INTERNAL_KEY}
    admin-key: ${PLATFORM_ADMIN_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,800ms,2s
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    # Guide §9: correlation id on every log line (MDC set by CorrelationIdFilter / message consumers).
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
  level:
    com.platform.people: INFO
    # IDE/browser HTTP probes on :9081 surface as Http2Exception; keep them out of ERROR noise.
    io.grpc.netty.shaded.io.grpc.netty.NettyServerTransport: WARN
    io.grpc.netty.shaded.io.grpc.netty.NettyServerTransport.connections: WARN
    io.grpc.netty.shaded.io.netty.handler.codec.http2: WARN
