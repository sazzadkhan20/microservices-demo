server:
  # REST + Spring Actuator (/actuator/health). Use THIS port for HTTP health probes.
  port: 8081
  shutdown: graceful

# gRPC only (Payroll → People employee/RBAC). HTTP clients that hit this port
# (browsers, IDE "open port", curl /actuator/health) get a protocol rejection — that is expected, not an outage.
grpc:
  server:
    port: 9081
    # Standard gRPC health (grpc.health.v1) for real gRPC probes — not HTTP actuator.
    health-service-enabled: true

spring:
  application:
    name: people-service
  # Guide §1/§5 — one fixed database owned by this service. Runtime uses a restricted DML role;
  # Liquibase uses a separate schema-owner (migration) role. Credentials come from env / secrets manager.
  datasource:
    url: ${PEOPLE_DB_URL:jdbc:postgresql://127.0.0.1:5433/people_db}
    username: ${PEOPLE_DB_USER:people_app}
    password: ${PEOPLE_DB_PASSWORD}
    hikari:
      pool-name: people-db
      maximum-pool-size: ${PEOPLE_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      # Keepalive + maxLifetime below typical Docker/NAT idle drops; avoids stale "connection has been closed"
      # after laptop sleep / long idle (OutboxRelay was failing with 10m housekeeper clock-leap warnings).
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 120000
      leak-detection-threshold: 60000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${PEOPLE_DB_MIGRATION_USER:people_migrator}
    password: ${PEOPLE_DB_MIGRATION_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 5
          multiplier: 2.0
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3
        multiplier: 2.0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

platform:
  gateway-base-url: ${GATEWAY_BASE_URL:http://127.0.0.1:8090}
  leave-base-url: ${LEAVE_BASE_URL:http://127.0.0.1:8086}
  time-work-base-url: ${TIME_WORK_BASE_URL:http://127.0.0.1:8087}
  payroll-base-url: ${PAYROLL_BASE_URL:http://127.0.0.1:8082}
  files-base-url: ${FILES_BASE_URL:http://127.0.0.1:8084}
  notification-base-url: ${NOTIFICATION_BASE_URL:http://127.0.0.1:8083}
  report-base-url: ${REPORT_BASE_URL:http://127.0.0.1:8085}
  employee-projection:
    publisher: true
  messaging:
    enabled: ${PLATFORM_MESSAGING_ENABLED:true}
    outbox-poll-ms: 1000
  security:
    # Requests (REST + gRPC) must carry X-Service-Key = this value (stamped by the gateway).
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY}
    internal-key: ${PLATFORM_INTERNAL_KEY}
    admin-key: ${PLATFORM_ADMIN_KEY}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persistAuthorization: true
    tryItOutEnabled: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.platform.people: INFO
    # IDE/browser HTTP probes on :9081 surface as Http2Exception; keep them out of ERROR noise.
    io.grpc.netty.shaded.io.grpc.netty.NettyServerTransport: WARN
    io.grpc.netty.shaded.io.grpc.netty.NettyServerTransport.connections: WARN
    io.grpc.netty.shaded.io.netty.handler.codec.http2: WARN
