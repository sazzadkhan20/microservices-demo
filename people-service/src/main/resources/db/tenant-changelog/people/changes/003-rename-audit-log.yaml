databaseChangeLog:
  # People-owned audit trail — distinct table name so DataGrip does not look "shared" (guide §3).
  - changeSet:
      id: people-003-rename-audit-log
      author: platform
      changes:
        - sql:
            splitStatements: false
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'audit_log'
                ) AND NOT EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'people_audit_log'
                ) THEN
                  ALTER TABLE audit_log RENAME TO people_audit_log;
                ELSIF NOT EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'people_audit_log'
                ) THEN
                  CREATE TABLE people_audit_log (
                    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                    at TIMESTAMPTZ NOT NULL,
                    actor_employee_id BIGINT,
                    action VARCHAR(64) NOT NULL,
                    entity VARCHAR(64),
                    entity_id VARCHAR(64),
                    before_json JSONB,
                    after_json JSONB,
                    ip VARCHAR(64)
                  );
                END IF;
                IF EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'audit_log'
                ) AND EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'people_audit_log'
                ) THEN
                  DROP TABLE audit_log CASCADE;
                END IF;
              END $$;
