/**
 * Shared library — no Spring Boot fat jar.
 * Shared security, API, messaging contracts and config helpers for all services.
 */
plugins {
    id 'java-library'
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'io.jsonwebtoken:jjwt-api:0.13.0'
    api 'com.zaxxer:HikariCP'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'
    compileOnly 'org.slf4j:slf4j-api'
    // EnvironmentPostProcessor (loads repo-root .env for IDE Run/Debug)
    compileOnly 'org.springframework.boot:spring-boot'
    // ResilientHttp (RestClient factory with deadlines); services provide spring-web at runtime
    compileOnly 'org.springframework:spring-web'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot'
    testImplementation 'org.slf4j:slf4j-api'
    testRuntimeOnly 'ch.qos.logback:logback-classic'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
