/**
 * Multi-project Gradle settings for the Qii HRMS (single company, fixed DB per service).
 *
 * Modules:
 *  - platform-common        : shared security, API envelope, JWT and config helpers
 *  - platform-messaging     : transactional outbox / inbox + RabbitMQ topology
 *  - hrms-api               : protobuf / gRPC API contract used by HRMS + Payroll
 *  - people-service         : employees, org, RBAC (guide §3)
 *  - leave-service          : leave policies, approvals, balances
 *  - time-work-service      : schedules, attendance, tasks, work logs
 *  - payroll-service        : reusable Payroll modular monolith (REST + gRPC client)
 *  - api-gateway            : sole public entry (JWT trust boundary + routing)
 *  - notification-service   : in-app notification inbox (port 8083)
 *  - file-service           : document upload / download (port 8084)
 *  - report-service         : attendance report exports (port 8085)
 */
rootProject.name = 'microservices-demo'

include 'platform-common'
include 'platform-messaging'
include 'hrms-api'
include 'people-service'
include 'leave-service'
include 'time-work-service'
include 'payroll-service'
include 'api-gateway'
include 'notification-service'
include 'file-service'
include 'report-service'
