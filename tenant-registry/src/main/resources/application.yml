# Tenant Registry — control plane only (not on the hot request path).
server:
  port: 8080

spring:
  application:
    name: tenant-registry
  datasource:
    # Use 127.0.0.1 (not localhost) on Windows — localhost may resolve to IPv6 ::1
    # while Docker Postgres publishes IPv4 only, which breaks JDBC connections.
    # Docker/deploy overrides via env vars (e.g. postgres-registry hostname).
    url: ${REGISTRY_DB_URL:jdbc:postgresql://127.0.0.1:5435/registry_db}
    username: ${REGISTRY_DB_USER:platform}
    password: ${REGISTRY_DB_PASSWORD:platform}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

# Admin JDBC used to CREATE DATABASE on HRMS / Payroll Postgres hosts.
platform:
  jwt:
    secret: ${JWT_SECRET:practice-jwt-secret-change-me-32chars-min}
  security:
    admin-key: ${PLATFORM_ADMIN_KEY:local-platform-admin-change-me}
    service-key: ${PLATFORM_SERVICE_KEY:local-service-key-change-me}
  provision:
    hrms:
      admin-url: ${HRMS_PG_ADMIN_URL:jdbc:postgresql://127.0.0.1:5433/postgres}
      host: ${HRMS_PG_HOST:127.0.0.1}
      port: ${HRMS_PG_PORT:5433}
      username: ${HRMS_PG_USER:platform}
      password: ${HRMS_PG_PASSWORD:platform}
      # Liquibase changelog shipped inside this jar for tenant schema bootstrap
      changelog: classpath:db/tenant-changelog/hrms/db.changelog-master.yaml
    payroll:
      admin-url: ${PAYROLL_PG_ADMIN_URL:jdbc:postgresql://127.0.0.1:5434/postgres}
      host: ${PAYROLL_PG_HOST:127.0.0.1}
      port: ${PAYROLL_PG_PORT:5434}
      username: ${PAYROLL_PG_USER:platform}
      password: ${PAYROLL_PG_PASSWORD:platform}
      changelog: classpath:db/tenant-changelog/payroll/db.changelog-master.yaml
    files:
      admin-url: ${FILES_PG_ADMIN_URL:jdbc:postgresql://127.0.0.1:5436/postgres}
      host: ${FILES_PG_HOST:127.0.0.1}
      port: ${FILES_PG_PORT:5436}
      username: ${FILES_PG_USER:platform}
      password: ${FILES_PG_PASSWORD:platform}
      changelog: classpath:db/tenant-changelog/files/db.changelog-master.yaml
    notification:
      admin-url: ${NOTIF_PG_ADMIN_URL:jdbc:postgresql://127.0.0.1:5436/postgres}
      host: ${NOTIF_PG_HOST:127.0.0.1}
      port: ${NOTIF_PG_PORT:5436}
      username: ${NOTIF_PG_USER:platform}
      password: ${NOTIF_PG_PASSWORD:platform}
      changelog: classpath:db/tenant-changelog/notification/db.changelog-master.yaml
    minio:
      enabled: ${MINIO_PROVISION_ENABLED:true}
      endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.platform.registry: INFO
