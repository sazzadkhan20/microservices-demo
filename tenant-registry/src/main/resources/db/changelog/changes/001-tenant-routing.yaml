databaseChangeLog:
  # Control-plane table: where each tenant's service DB lives.
  # Domain services cache this in Redis; they do not hit this table on every request.
  - changeSet:
      id: 001-tenant-routing
      author: platform
      changes:
        - createTable:
            tableName: tenant_routing
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: service_name
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: jdbc_url
                  type: VARCHAR(512)
                  constraints:
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(128)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(256)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: tenant_routing
            columnNames: service_name, tenant_id
            constraintName: uk_tenant_routing_service_tenant
        - createIndex:
            tableName: tenant_routing
            indexName: idx_tenant_routing_tenant
            columns:
              - column:
                  name: tenant_id
