databaseChangeLog:
  - changeSet:
      id: files-001-file-object
      author: platform
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: file_object
      changes:
        - createTable:
            tableName: file_object
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: tenant_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: original_name
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(127)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: uploaded_by
                  type: VARCHAR(255)
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: file_object
            indexName: idx_file_tenant
            columns:
              - column:
                  name: tenant_id
