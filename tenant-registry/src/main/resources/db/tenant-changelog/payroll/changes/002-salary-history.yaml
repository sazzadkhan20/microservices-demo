databaseChangeLog:
  - changeSet:
      id: payroll-002-salary-history
      author: platform
      changes:
        - createTable:
            tableName: salary_history
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: employee_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: effective_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: NUMERIC(19, 4)
                  constraints:
                    nullable: false
              - column:
                  name: pay_type
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(8)
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: VARCHAR(512)
              - column:
                  name: created_by
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
        - createIndex:
            tableName: salary_history
            indexName: idx_salary_history_employee
            columns:
              - column:
                  name: employee_id
              - column:
                  name: effective_date
