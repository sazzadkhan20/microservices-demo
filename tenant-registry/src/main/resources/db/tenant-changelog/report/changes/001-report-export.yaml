databaseChangeLog:
  - changeSet:
      id: report-001-export-archive
      author: platform
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: report_export
      changes:
        - createTable:
            tableName: report_export
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
              - column:
                  name: report_type
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
              - column:
                  name: period_label
                  type: VARCHAR(32)
              - column:
                  name: employee_id
                  type: BIGINT
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: VARCHAR(127)
                  constraints:
                    nullable: false
              - column:
                  name: size_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: storage_key
                  type: VARCHAR(500)
              - column:
                  name: requested_by
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createIndex:
            tableName: report_export
            indexName: idx_report_export_type_period
            columns:
              - column:
                  name: report_type
              - column:
                  name: period_label
