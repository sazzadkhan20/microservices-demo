databaseChangeLog:
  # Time&Work owns timework_settings only — never a cloned People tenant_settings blob (guide §3).
  - changeSet:
      id: timework-003-rename-tenant-settings
      author: platform
      changes:
        - sql:
            sql: |
              DO $$
              BEGIN
                IF EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'tenant_settings'
                ) AND NOT EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'timework_settings'
                ) THEN
                  ALTER TABLE tenant_settings RENAME TO timework_settings;
                ELSIF NOT EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'timework_settings'
                ) THEN
                  CREATE TABLE timework_settings (
                    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                    settings JSONB NOT NULL,
                    updated_at TIMESTAMPTZ NOT NULL
                  );
                END IF;
                IF EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'tenant_settings'
                ) AND EXISTS (
                  SELECT 1 FROM information_schema.tables
                  WHERE table_schema = 'public' AND table_name = 'timework_settings'
                ) THEN
                  DROP TABLE tenant_settings CASCADE;
                END IF;
              END $$;
