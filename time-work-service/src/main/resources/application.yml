server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: time-work-service
  # Guide §1/§5 — one fixed database owned by this service. Runtime uses a restricted DML role;
  # Liquibase uses a separate schema-owner (migration) role. Credentials come from env / secrets manager.
  datasource:
    url: ${TIMEWORK_DB_URL:jdbc:postgresql://127.0.0.1:5433/timework_db}
    username: ${TIMEWORK_DB_USER:timework_app}
    password: ${TIMEWORK_DB_PASSWORD}
    hikari:
      pool-name: timework-db
      maximum-pool-size: ${TIMEWORK_DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 120000
      leak-detection-threshold: 60000
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    user: ${TIMEWORK_DB_MIGRATION_USER:timework_migrator}
    password: ${TIMEWORK_DB_MIGRATION_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 5000
    listener:
      simple:
        acknowledge-mode: auto
        missing-queues-fatal: false
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 2000
          max-attempts: 5
          multiplier: 2.0
    template:
      retry:
        enabled: true
        initial-interval: 500
        max-attempts: 3
        multiplier: 2.0
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
  autoconfigure:
    exclude:
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerFactoryAutoConfiguration
      - net.devh.boot.grpc.server.autoconfigure.GrpcServerAutoConfiguration

platform:
  leave-base-url: ${LEAVE_BASE_URL:http://127.0.0.1:8086}
  people-base-url: ${PEOPLE_BASE_URL:${HRMS_BASE_URL:http://127.0.0.1:8081}}
  hrms-base-url: ${HRMS_BASE_URL:http://127.0.0.1:8081}
  messaging:
    enabled: ${PLATFORM_MESSAGING_ENABLED:true}
  security:
    require-gateway: ${PLATFORM_REQUIRE_GATEWAY:true}
    service-key: ${PLATFORM_SERVICE_KEY}
    internal-key: ${PLATFORM_INTERNAL_KEY}
    admin-key: ${PLATFORM_ADMIN_KEY}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  level:
    com.platform.timework: INFO
